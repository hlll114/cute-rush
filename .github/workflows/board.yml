name: sync-leaderboard

on:
  schedule:
    - cron: '13 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Merge live scores into board.json
        run: node sync-board.mjs
      - name: Commit if changed
        run: |
          git config user.name  "cute-rush-bot"
          git config user.email "bot@users.noreply.github.com"
          git add board.json
          if ! git diff --staged --quiet; then
            git commit -m "board: sync $(date -u +%FT%TZ)"
            git push
          fi
