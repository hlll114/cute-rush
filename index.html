  function applyAvatar(url){
    myAvatar = url || '';
    headReady = false;
    headImg.src = myAvatar || DEFAULT_AVATAR;
    const a = document.getElementById('hero'), b = document.getElementById('hero2');
    if (a) a.src = headImg.src;
    if (b) b.src = headImg.src;
  }

  function processAvatarFile(file){
    if (!file) return;
    if (file.size > 12 * 1024 * 1024){ toast('图片太大了，换一张小点的～'); return; }
    const img = new Image();
    img.onload = function(){
      try {
        const S = 320;
        const c = document.createElement('canvas'); c.width = c.height = S;
        const g = c.getContext('2d');
        const sc = Math.max(S / img.width, S / img.height);
        const w = img.width * sc, h = img.height * sc;
        g.drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
        g.globalCompositeOperation = 'destination-in';
        g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 3, 0, 7); g.fill();
        g.globalCompositeOperation = 'source-over';
        g.strokeStyle = '#ffffff'; g.lineWidth = 16;
        g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 7, 0, 7); g.stroke();
        g.strokeStyle = '#ff92b8'; g.lineWidth = 7;
        g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 16, 0, 7); g.stroke();
        const url = c.toDataURL('image/png');
        try { localStorage.setItem('cr_avatar', url); } catch(e){}
        applyAvatar(url);
        toast('换好啦！这样够可爱了吧');
      } catch(e){ toast('处理失败，换一张试试'); }
      if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
    };
    img.onerror = function(){ toast('这张图打不开，换一张试试'); };
    img.src = URL.createObjectURL(file);
  }

  let toastTimer = 0;
  function toast(msg){
    let el = document.getElementById('toast');
    if (!el){
      el = document.createElement('div'); el.id = 'toast'; el.className = 'toast';
      app.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.style.opacity = '0'; }, 2000);
  }

  /* ================= 全球排行榜 =================
     三路数据合并：
     ① 实时层 ntfy.sh（免注册、可跨域、单条 ≤4KB，能带 40×40 头像，保留 12 小时）
     ② 归档层 board.json（同目录静态文件，由 GitHub Action 定时把实时层落库，永久保存）
     ③ 兜底层 restful-api（永久但只有 12 席、不能存头像）
     再加上本机 localStorage，断网也能看到自己的最好成绩
  */
  const NT_TOPIC = 'cute-rush-lb-4k9x2m';
  const NT = '';  /* 平台版：无外链 */
  const ARCHIVE_URL = 'board.json';
  const LB_API = '';  /* 平台版：无外链 */
  const LB_LEGACY_MAX = 12;
  const LB_MAX = 50;
  let lbCache = [];

  function safeAvatar(a){ return (typeof a === 'string' && a.indexOf('data:image/') === 0) ? a : ''; }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
    });
  }
  function normEntry(e){
    if (!e || typeof e !== 'object') return null;
    const id = String(e.id || '').slice(0, 32);
    const s = Number(e.s);
    if (!id || !isFinite(s) || s < 0 || s > 1e8) return null;
    return { id: id, n: String(e.n || '无名跑者').slice(0, 10), s: Math.round(s),
             d: Math.round(Number(e.d) || 0), a: safeAvatar(e.a), t: Number(e.t) || 0 };
  }
  function mergeEntries(){
    const map = new Map();
    for (let i = 0; i < arguments.length; i++){
      const list = arguments[i] || [];
      for (let k = 0; k < list.length; k++){
        const e = normEntry(list[k]);
        if (!e) continue;
        const cur = map.get(e.id);
        if (!cur) { map.set(e.id, e); continue; }
        // 分数更高者胜；同分优先保留带头像的那条
        if (e.s > cur.s || (e.s === cur.s && !cur.a && e.a)) { map.set(e.id, e); continue; }
        // 分数没超过时，仍用较新的昵称/头像刷新榜上展示
        if ((e.t || 0) >= (cur.t || 0)){
          cur.n = e.n;
          if (e.a) cur.a = e.a;
          cur.t = e.t || cur.t;
        }
      }
    }
    return Array.from(map.values()).sort(function(a, b){ return b.s - a.s; }).slice(0, LB_MAX);
  }
  function lbLocal(){
    try { return JSON.parse(localStorage.getItem('cr_lb_local') || '[]'); } catch(e){ return []; }
  }
  function lbSaveLocal(entry){
    try {
      const list = mergeEntries([entry], lbLocal()).slice(0, 5);
      localStorage.setItem('cr_lb_local', JSON.stringify(list));
    } catch(e){}
  }

  // ① 实时层
  async function lbLive(){
    const r = await fetch(NT + '/json?poll=1&since=24h', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    const out = [];
    for (const line of txt.split('\n')){
      if (!line.trim()) continue;
      try {
        const j = JSON.parse(line);
        if (j && j.event === 'message' && j.message) out.push(JSON.parse(j.message));
      } catch(e){}
    }
    return out;
  }
  async function lbPublish(entry){
    const r = await fetch(NT, {
      method: 'POST',
      headers: { 'content-type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify(entry)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
  }
  // ② 归档层
  async function lbArchive(){
    try {
      const r = await fetch(ARCHIVE_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return [];
      const j = await r.json();
      return Array.isArray(j.entries) ? j.entries : [];
    } catch(e){ return []; }
  }
  // ③ 兜底层（永久，12 席，无头像）
  async function lbLegacy(){
    const r = await fetch(LB_API + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const e = (j && j.data && Array.isArray(j.data.entries)) ? j.data.entries : [];
    return e;
  }
  async function lbPushLegacy(entry){
    const list = mergeEntries(await lbLegacy()).slice(0, LB_LEGACY_MAX);
    const i = list.findIndex(function(e){ return e.id === uid; });
    if (i >= 0){
      if (list[i].s < entry.s) list[i] = entry;
    } else {
      list.push(entry);
    }
    list.sort(function(a, b){ return b.s - a.s; });
    const top = list.slice(0, LB_LEGACY_MAX).map(function(e){
      return { id: e.id, n: e.n, s: e.s, d: e.d, t: e.t };
    });
    const r = await fetch(LB_API, {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ name: 'cute-rush-board-v1', data: { entries: top, updated: Date.now() } })
    });
    if (!r.ok) throw new Error('PUT ' + r.status);
  }
  // 汇总
  async function lbLoad(){
    const res = await Promise.all([
      lbLive().catch(function(){ return null; }),
      lbArchive(),
      lbLegacy().catch(function(){ return null; })
    ]);
    const live = res[0], archive = res[1], legacy = res[2];
    if (live === null && legacy === null && !archive.length){
      const local = lbLocal();
      if (!local.length) throw new Error('offline');
      return mergeEntries(local);
    }
    return mergeEntries(live || [], archive, legacy || [], lbLocal());
  }

  function avatarThumb(){
    try {
      const S = 40;
      const c = document.createElement('canvas'); c.width = c.height = S;
      const g = c.getContext('2d');
      g.fillStyle = '#ffd9ea'; g.fillRect(0, 0, S, S);
      const im = headImg;
      if (im && im.complete && im.naturalWidth){
        const sc = Math.max(S / im.naturalWidth, S / im.naturalHeight);
        const w = im.naturalWidth * sc, h = im.naturalHeight * sc;
        g.save(); g.beginPath(); g.arc(S / 2, S / 2, S / 2, 0, 7); g.clip();
        g.drawImage(im, (S - w) / 2, (S - h) / 2, w, h);
        g.restore();
      }
      return c.toDataURL('image/jpeg', 0.62);
    } catch(e){ return ''; }
  }

  function myEntry(score, dist){
    return {
      id: uid,
      n: (myName || '无名跑者').slice(0, 10),
      s: Math.max(0, Math.round(score)),
      d: Math.max(0, Math.round(dist)),
      a: avatarThumb(),
      t: Date.now()
    };
  }

  // 发一条成绩：实时层 + 兜底层都写，再重新拉取合并
  async function lbPush(entry){
    lbSaveLocal(entry);
    let ok = false;
    try { await lbPublish(entry); ok = true; } catch(e){}
    try { await lbPushLegacy(entry); ok = true; } catch(e){}
    const list = await lbLoad().catch(function(){ return mergeEntries([entry], lbLocal()); });
    lbCache = list;
    const rank = list.findIndex(function(e){ return e.id === uid; });
    if (!ok) throw new Error('offline');
    return rank >= 0 ? rank + 1 : null;
  }

  async function submitScore(){
    if (PORTAL) return;
    const line = document.getElementById('rankLine');
    line.textContent = '正在上传成绩…';
    const entry = myEntry(G.score, G.dist);
    if (!entry.s){ line.textContent = ''; return; }
    try {
      const rank = await lbPush(entry);
      line.textContent = rank ? ('🌍 全球第 ' + rank + ' 名！') : '成绩已记录';
    } catch(e){
      try { localStorage.setItem('cr_pending', JSON.stringify(entry)); } catch(_){}
      line.textContent = '排行榜暂时连不上，成绩先存在本机' + (window.__lbDebug ? ' [' + (e && e.message) + ']' : '');
    }
  }

  async function flushPending(){
    let raw = null;
    try { raw = localStorage.getItem('cr_pending'); } catch(e){}
    if (!raw) return;
    try {
      const e = JSON.parse(raw);
      if (e && typeof e.s === 'number' && e.s > 0){
        const rank = await lbPush(e);
        if (rank) { try { localStorage.removeItem('cr_pending'); } catch(_){} }
      }
    } catch(_){}
  }

  function avatarHtml(e){
    const av = safeAvatar(e.a);
    if (av) return '<img src="' + av + '" alt="">';
    return '<span class="avph">' + escapeHtml((e.n || '?').slice(0, 1)) + '</span>';
  }

  function renderBoard(list){
    const el = document.getElementById('boardList');
    const pod = document.getElementById('podium');
    if (!list.length){
      pod.innerHTML = '';
      el.innerHTML = '<div class="empty">还没有人上榜～<br>跑一把，第一个留下名字的就是你！</div>';
      return;
    }
    // 领奖台：2 - 1 - 3
    let ph = '';
    [1, 0, 2].forEach(function(idx){
      const e = list[idx];
      if (!e) return;
      const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : '🥉';
      ph += '<div class="pod p' + (idx + 1) + '">' +
            '<span class="medal">' + medal + '</span>' +
            avatarHtml(e) +
            '<span class="pnm">' + escapeHtml(e.n || '无名跑者') + '</span>' +
            '<b>' + (e.s | 0) + '</b></div>';
    });
    pod.innerHTML = ph;

    let html = '';
    for (let i = 3; i < list.length; i++){
      const e = list[i];
      const me = e.id === uid ? ' me' : '';
      html += '<div class="brow' + me + '"><span class="rk">' + (i + 1) + '</span>' +
        avatarHtml(e) +
        '<span class="nm">' + escapeHtml(e.n || '无名跑者') + '</span>' +
        '<span class="sc">' + (e.s | 0) + '</span></div>';
    }
    el.innerHTML = html || '<div class="empty">只有前三名，去挑战他们吧！</div>';
  }

  async function openBoard(){
    if (PORTAL) return;
    show('scrBoard');
    const el = document.getElementById('boardList');
    const tip = document.getElementById('boardTip');
    document.getElementById('podium').innerHTML = '';
    el.innerHTML = '<div class="empty">加载中…</div>';
    tip.textContent = '';
    try {
      let list = await lbLoad();
      if (!list.some(function(e){ return e.id === uid; }) && G.best > 0){
        try { await lbPush(myEntry(G.best, G.bestDist)); list = await lbLoad(); } catch(_){}
      }
      lbCache = list;
      renderBoard(list);
      const rank = list.findIndex(function(e){ return e.id === uid; });
      const mine = rank >= 0 ? list[rank] : null;
      tip.textContent = rank >= 0
        ? ('你排第 ' + (rank + 1) + ' 名 · ' + mine.s + ' 分 · 共 ' + list.length + ' 人')
        : '你还没上榜，跑一把就能留名～';
    } catch(e){
      renderBoard(lbCache);
      tip.textContent = '排行榜暂时连不上，先看看缓存';
    }
  }

  /* ================= HUD ================= */
  const elLives = document.getElementById('lives');
  const elScore = document.getElementById('score');
  const elDist = document.getElementById('dist');
  const elBuffs = document.getElementById('buffs');
  function updateHearts(pulse){
    let s = '';
    for (let i = 0; i < 3; i++) s += '<span class="h' + (i < G.lives ? '' : ' off') + '">❤</span>';
    elLives.innerHTML = s;
    if (pulse){ elLives.classList.remove('pulse'); void elLives.offsetWidth; elLives.classList.add('pulse'); }
  }
  let lastScore = -1, lastBuffs = '';
  function updateScore(force){
    G.score = Math.floor(G.dist) + G.stars * 20;
    if (G.score !== lastScore || force){
      elScore.textContent = G.score;
      elDist.textContent = Math.floor(G.dist) + ' m';
      lastScore = G.score;
    }
  }
  function updateBuffs(){
    const arr = [];
    if (G.shield) arr.push('<div class="buff">护盾 ON</div>');
    if (G.magnet > 0) arr.push('<div class="buff">磁铁 <span class="bar"><i style="width:' + Math.round(G.magnet / 9 * 100) + '%"></i></span></div>');
    if (G.zw > 0) arr.push('<div class="buff" style="color:#7b61ff">⏱ 时停 <span class="bar"><i style="width:' + Math.round(G.zw / ZW_TIME * 100) + '%;background:#8b7bff"></i></span></div>');
    const html = arr.join('');
    if (html !== lastBuffs){ elBuffs.innerHTML = html; lastBuffs = html; }
  }

  // 道具权重：护盾 45% / 磁铁 33% / 时停 22%
  function pickWeighted(){
    const r = Math.random();
    if (r < .45) return 'shield';
    if (r < .78) return 'magnet';
    return 'slow';
  }

  /* ================= 生成 ================= */
  function addObj(kind, off, z, extra){
    const o = { kind, off, z, t: rnd(0, 6), dead: false };
    if (extra) Object.assign(o, extra);
    objs.push(o);
    return o;
  }

  function spawnRow(){
    const lanes = [-1, 0, 1];
    const d = clamp((G.dist - 150) / 2400, 0, 1);     // 0..1 难度
    const z = SPAWN_Z;
    const r = Math.random();

    // 爱心：稀有小概率
    if (G.lives < 3 && G.dist > 200 && Math.random() < .10){
      addObj('heart', pick(lanes), z);
      addObj(pick(['cone', 'crate', 'cat']), pick(lanes.filter(v => v !== 0)), z + 12);
      return;
    }
    // 道具
    if (Math.random() < .11){
      addObj(pickWeighted(), pick(lanes), z);
      if (Math.random() < .5) addObj(pick(['cone', 'cat']), pick(lanes), z + 14);
      return;
    }
    // 星星串（含空中弧线）
    if (r < .26){
      const l = pick(lanes);
      if (Math.random() < .45){
        // 空中弧线：配合跳跃
        for (let i = 0; i < 5; i++) addObj('star', l, z + i * 4, { h: Math.round(120 * Math.sin(Math.PI * (i + 1) / 6)) });
        if (d > .3) addObj(pick(['cone', 'crate']), l, z + 8);
      } else {
        for (let i = 0; i < 4; i++) addObj('star', l, z + i * 5);
        if (d > .45) addObj('bar', pick(lanes.filter(v => v !== l)), z + 7);
      }
      return;
    }
    // 需要跳的矮障碍
    if (r < .46){
      const l = pick(lanes);
      addObj(pick(['hurdle', 'cone', 'crate']), l, z);
      if (Math.random() < .6) addObj('star', l, z + 3, { h: 96 });
      if (d > .35) addObj(pick(['cone', 'cat']), pick(lanes.filter(v => v !== l)), z + rnd(2, 6));
      return;
    }
    // 需要滑铲的横杆
    if (r < .64){
      const l = pick(lanes);
      addObj('bar', l, z);
      addObj('star', l, z + 6, { h: 0 });
      addObj('star', l, z + 9, { h: 0 });
      if (d > .4) addObj(pick(['hurdle', 'cat']), pick(lanes.filter(v => v !== l)), z + rnd(3, 8));
      return;
    }
    // 两车道封死
    if (r < .88){
      const sh = lanes.slice().sort(() => Math.random() - .5);
      addObj(pick(['wall', 'crate', 'cat']), sh[0], z);
      addObj(pick(['wall', 'cone', 'hurdle']), sh[1], z + rnd(0, 2));
      if (Math.random() < .8) addObj('star', sh[2], z + 6);
      return;
    }
    // 火车（后期）
    if (d > .45){
      const l = pick(lanes);
      const train = addObj('train', l, z + 6, { len: 12 + Math.round(d * 10), long: true });
      addObj('star', l, z + 6 + train.len + 6);
      addObj(pick(['cone', 'hurdle']), pick(lanes.filter(v => v !== l)), z + 2);
      return;
    }
    // 三车道错位
    const sh = lanes.slice().sort(() => Math.random() - .5);
    addObj('cone', sh[0], z);
    addObj('bar', sh[2], z + 4);
    addObj('star', sh[1], z + 10);
  }

  /* ================= 更新 ================= */
  function update(dt){
    if (G.state !== 'play'){ updateParticles(dt); return; }
    let ts = G.slow > 0 ? .38 : 1;
    if (G.zw > 0) ts *= .42;
    G.slow = Math.max(0, G.slow - dt);
    const wdt = dt * ts;

    G.t += dt;
    const d = clamp(G.dist / 2600, 0, 1);
    G.speed = 16 + 30 * Math.pow(d, .88);           // 16 → 46
    G.dist += G.speed * wdt;

    // 场景切换横幅
    const bp = biomePhase();
    if (bp.i !== G.biome){
      G.biome = bp.i;
      const bi = BIOMES[bp.i];
      paintPageBG(bi);
      G.banner = { text: bi.icon + '  ' + bi.name, t: 0, life: 2.4 };
      sfx.biome();
      say('新场景！');
    }

    // 玩家横向 + 跳跃 + 滑铲
    // 变道手感：更快贴合目标车道（约 0.12 秒到位），带一点回弹感
    P.x += (P.tx - P.x) * Math.min(1, dt * 27);
    if (P.air){
      P.vy -= GRAV * dt; P.y += P.vy * dt;
      const px0 = LW * .5 + P.x * LANE_U;
      // 跳跃拖影
      if (Math.random() < .8){
        parts.push({ x: px0 + rnd(-16, 16), y: BASE_Y - 34 - P.y + rnd(-8, 8),
          vx: rnd(-14, 14), vy: rnd(40, 110), life: .34, max: .34,
          col: 'rgba(255,255,255,.8)', size: rnd(4, 9), g: 90 });
      }
      if (P.y <= 0){
        P.y = 0; P.vy = 0; P.air = false; P.stretch = .82;
        G.shake = Math.max(G.shake, 6);
        sfx.land();
        const px = LW * .5 + P.x * LANE_U;
        ringBurst(px, BASE_Y + 10, 'rgba(255,255,255,.9)', 24, 104, .5, 8);
        ringBurst(px, BASE_Y + 10, 'rgba(255,200,225,.8)', 10, 58, .3, 5);
        burst(px, BASE_Y, 'rgba(255,255,255,.9)', 14, 200, 45);
      }
    }
    // 拉伸回弹
    P.stretch += (1 - P.stretch) * Math.min(1, dt * 13);
    // 下蹲曲线：快速蹲下 → 保持 → 起身
    if (P.slide > 0){
      const elapsed = SLIDE_T - P.slide;
      P.crouch = Math.min(1, elapsed / .07, P.slide / .11);
      if (Math.random() < .7){
        const px1 = LW * .5 + P.x * LANE_U;
        parts.push({ x: px1 + rnd(-34, 34), y: BASE_Y - rnd(0, 12),
          vx: rnd(-70, 70), vy: rnd(-60, -10), life: .3, max: .3,
          col: 'rgba(255,240,250,.85)', size: rnd(3, 7), g: 40 });
      }
      P.slide = Math.max(0, P.slide - dt);
    } else if (P.crouch > 0){
      P.crouch = Math.max(0, P.crouch - dt * 9);
    }

    if (G.inv > 0) G.inv = Math.max(0, G.inv - dt);
    if (G.graceT > 0) G.graceT = Math.max(0, G.graceT - dt);
    if (G.comboT > 0){ G.comboT -= dt; if (G.comboT <= 0) G.combo = 0; }
    if (G.magnet > 0) G.magnet = Math.max(0, G.magnet - dt);
    if (G.zw > 0) G.zw = Math.max(0, G.zw - dt);
    if (G.zwFlash > 0) G.zwFlash = Math.max(0, G.zwFlash - dt);

    // 生成
    const gap = 1.18 - d * .62;
    G.spawnT -= wdt;
    if (G.spawnT <= 0){ spawnRow(); G.spawnT = gap * rnd(.82, 1.2); }

    // 里程碑
    if (G.dist > G.nextMilestone){
      G.nextMilestone += 300; G.level++;
      popText(LW / 2, LH * .40, '加速！+' + (G.level * 50), '#ff5f9b');
      G.stars += 3;
      sfx.level();
      say(pick(CHEER));
    }

    // 物体推进
    for (const o of objs){
      o.t += wdt;
      if (o.dead) continue;

      // 磁铁：范围内的星星被"吸"向玩家（有飞行过程，不是瞬间消失）
      if (o.kind === 'star' && G.magnet > 0 &&
          (o.pull || (o.z < 24 && o.z > 1 && Math.abs(o.off - P.x) < 2.6))){
        o.pull = true;
        const kz = Math.min(1, wdt * 5.2), ko = Math.min(1, wdt * 9);
        o.z += (1.05 - o.z) * kz;
        o.off += (P.x - o.off) * ko;
        o.h = (o.h || 0) + (P.y - (o.h || 0)) * ko;
        if (o.z < 2.8 && Math.abs(o.off - P.x) < .5) collectStar(o);
        if (o.dead) continue;
        continue;
      }

      const zPrev = o.z;
      o.z -= (G.speed + (o.long ? 8 : 0)) * wdt;

      if (o.long){
        // 火车：整段覆盖判定
        if (o.z <= HIT_Z + 1.2 && o.z + o.len > HIT_Z - 1.2 && Math.abs(o.off - P.x) < .55 && G.graceT <= 0 && G.inv <= 0){
          crash(o);
        }
      } else if (zPrev > HIT_Z && o.z <= HIT_Z){
        const dx = Math.abs(o.off - P.x);
        if (o.kind === 'star'){
          if (dx < .8 && Math.abs((o.h || 0) - P.y) < 78) collectStar(o);
        } else if (o.kind === 'heart'){
          if (dx < .85) collectHeart(o);
        } else if (o.kind === 'shield' || o.kind === 'magnet' || o.kind === 'slow'){
          if (dx < .85) collectPower(o);
        } else if (dx < .62 && G.graceT <= 0 && G.inv <= 0){
          if (o.kind === 'bar'){
            if (P.slide <= 0) crash(o); else slipUnder(o);
          } else if (o.kind === 'hurdle' || o.kind === 'cone' || o.kind === 'crate' || o.kind === 'cat'){
            if (P.y < 46) crash(o); else hopOver(o);
          } else {
            crash(o);
          }
        }
      }
      if (o.z < -4 || (o.long && o.z + o.len < -4)) o.dead = true;
    }
    objs = objs.filter(o => !o.dead);

    // 尾迹 + 环境粒子
    if (Math.random() < .5){
      parts.push({ x: LW * .5 + P.x * LANE_U + rnd(-40, 40), y: BASE_Y - rnd(0, 18) - P.y,
        vx: rnd(-20, 20), vy: rnd(-10, 24), life: .4, max: .4,
        col: 'rgba(255,255,255,.8)', size: rnd(3, 7), g: -30 });
    }
    if (Math.random() < .35) spawnAmbient(BIOMES[bp.i]);
    for (const a of ambient){
      a.x += a.vx * dt; a.y += a.vy * dt; a.life -= dt * .5;
      if (a.life <= 0 || a.y > LH + 20) a.life = 0;
    }
    ambient = ambient.filter(a => a.life > 0);

    if (G.banner){ G.banner.t += dt; if (G.banner.t > G.banner.life) G.banner = null; }

    updateParticles(dt);
    updateScore();
    updateBuffs();
  }

  function updateParticles(dt){
    for (const p of parts){
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 120) * dt; p.vx *= .98;
    }
    parts = parts.filter(p => p.life > 0);
    for (const p of pops){ p.life += dt; p.y -= 42 * dt; }
    pops = pops.filter(p => p.life < p.max);
    if (bubble){ bubble.t += dt; if (bubble.t > bubble.life) bubble = null; }
    G.shake *= Math.pow(.001, dt);
    G.flash = Math.max(0, G.flash - dt * 3.2);
  }

  function collectStar(o){
    o.dead = true; G.stars++; G.combo++; G.comboT = 2.4;
    const mult = Math.min(5, 1 + Math.floor(G.combo / 4));
    G.dist += 2 * mult;
    const sx = xOf(o.off, o.z), sy = yOf(o.z) - 30 * proj(o.z) - (o.h || 0) * proj(o.z);
    burst(sx, sy, '#ffd84f', 7, 200, 60);
    popText(sx, sy - 10, '+' + (mult > 1 ? 'x' + mult : '15'), '#ffd84f');
    sfx.coin(G.combo);
    if (G.combo > 0 && G.combo % 10 === 0) say(pick(CHEER));
  }
  function collectHeart(o){
    o.dead = true;
    G.lives = Math.min(3, G.lives + 1);
    updateHearts(true);
    const sx = xOf(o.off, o.z), sy = yOf(o.z) - 34 * proj(o.z);
    burst(sx, sy, '#ff6aa8', 14, 260, 70);
    popText(sx, sy - 10, '+1 ❤', '#ff6aa8');
    sfx.heart(); say('回血啦！');
  }
  function collectPower(o){
    o.dead = true;
    const sx = xOf(o.off, o.z), sy = yOf(o.z) - 34 * proj(o.z);
    if (o.kind === 'shield'){
      G.shield = true; popText(sx, sy - 10, '护盾 GET!', '#7fc8ff');
      burst(sx, sy, '#7fc8ff', 14, 260, 70);
    } else if (o.kind === 'slow'){
      G.zw = ZW_TIME; G.zwFlash = 1.6;
      popText(sx, sy - 10, 'THE WORLD!', '#a98bff');
      burst(sx, sy, '#a98bff', 20, 280, 80);
      burst(sx, sy, '#ffffff', 10, 180, 40);
      sfx.zw();
    } else {
      G.magnet = 9; popText(sx, sy - 10, '磁铁 9s', '#ff8fd0');
      burst(sx, sy, '#ff8fd0', 14, 260, 70);
    }
    if (o.kind !== 'slow') sfx.power();
    say(o.kind === 'shield' ? '有护盾啦！' : o.kind === 'slow' ? '时间停止！' : '吸星星～');
    updateBuffs();
  }
  function hopOver(o){
    o.dead = true;
    const sx = xOf(o.off, o.z), sy = yOf(o.z) - 30;
    burst(sx, sy, 'rgba(255,255,255,.9)', 6, 160, 60);
    popText(sx, sy - 20, '跳！', '#8fe8c4');
    G.dist += 4;
  }
  function slipUnder(o){
    o.dead = true;
    const sx = xOf(o.off, o.z), sy = yOf(o.z) - 90 * proj(o.z);
    burst(sx, sy, 'rgba(160,220,255,.95)', 8, 180, 40);
    popText(sx, sy - 10, '滑！', '#7fc8ff');
    G.dist += 4;
  }
  function crash(o){
    if (G.shield){
      G.shield = false; o.dead = true;
      G.inv = .9; G.shake = 10; G.flash = .25;
      const sx = xOf(o.off, o.z), sy = yOf(o.z) - 30;
      burst(sx, sy, '#7fc8ff', 18, 300, 80);
      popText(LW * .5, LH * .55, '护盾挡下！', '#7fc8ff');
      sfx.hit(); say('没事！');
      updateBuffs();
      return;
    }
    o.dead = true;
    G.lives--;
    G.inv = 1.8; G.shake = 22; G.flash = .55; G.slow = .42; G.combo = 0;
    updateHearts(true);
    const sx = xOf(o.off, o.z), sy = yOf(o.z) - 20;
    burst(sx, sy, '#ff9ec4', 16, 300, 90);
    burst(sx, sy, '#ffffff', 10, 220, 70);
    sfx.hit();
    say(pick(['啊哦！', '小心呀！', '不要撞啦！']));
    if (G.lives <= 0){
      G.state = 'dying'; G.dyingT = .75; G.shake = 30; G.flash = .8;
    }
  }

  /* ================= 渲染 ================= */
  function render(){
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, LW, LH);

    const bp = biomePhase();
    const bi = BIOMES[bp.i], biN = BIOMES[bp.next];
    const t = bp.t;

    const sh = G.shake;
    ctx.save();
    if (sh > .4) ctx.translate(rnd(-sh, sh) * .5, rnd(-sh, sh) * .5);

    // 背景（交叉淡入）
    const bgA = biomeBG(bi);
    ctx.drawImage(bgA, 0, 0, LW, LH);
    if (t > .01){
      const bgB = biomeBG(biN);
      ctx.globalAlpha = t; ctx.drawImage(bgB, 0, 0, LW, LH); ctx.globalAlpha = 1;
    }

    drawRoad(bi, biN, t);
    const darkAmt = lerp(bi.dark ? 1 : 0, biN.dark ? 1 : 0, t) * .2;
    drawScenery(t > .5 ? biN : bi, darkAmt);

    // 环境粒子
    for (const a of ambient){
      ctx.globalAlpha = clamp(a.life, 0, 1) * .8;
      if (a.kind === 'petal'){
        ctx.fillStyle = a.hue + '.9)';
        ctx.beginPath(); ctx.ellipse(a.x, a.y, a.size * 1.6, a.size * .8, a.x * .01, 0, 7); ctx.fill();
      } else if (a.kind === 'firefly'){
        ctx.fillStyle = a.hue + (.6 + Math.sin(G.t * 6 + a.x) * .3) + ')';
        ctx.beginPath(); ctx.arc(a.x, a.y, a.size * .9, 0, 7); ctx.fill();
      } else {
        ctx.fillStyle = a.hue + '.65)';
        ctx.beginPath(); ctx.arc(a.x, a.y, a.size, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // 物体
    const list = objs.slice().sort((a, b) => b.z - a.z);
    for (const o of list){
      if (o.z < -3) continue;
      const alpha = clamp((SPAWN_Z - o.z) / 12, 0, 1);
      if (alpha <= .01) continue;
      if (o.kind === 'train'){
        ctx.save(); ctx.globalAlpha = alpha; drawTrain(o); ctx.restore();
        continue;
      }
      const s = proj(o.z);
      const x = xOf(o.off, o.z), y = yOf(o.z);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.scale(s, s);
      if (o.kind === 'cone') drawCone();
      else if (o.kind === 'crate') drawCrate();
      else if (o.kind === 'cat') drawCat();
      else if (o.kind === 'hurdle') drawHurdle();
      else if (o.kind === 'bar') drawBar();
      else if (o.kind === 'wall') drawWall();
      else if (o.kind === 'star') drawStar(o);
      else if (o.kind === 'heart') drawHeartItem(o);
      else if (o.kind === 'shield' || o.kind === 'magnet' || o.kind === 'slow') drawPower(o.kind, o);
      ctx.restore();
    }

    // 速度线
    const sp = (G.speed - 16) / 30;
    if (sp > .12 && G.state === 'play'){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineCap = 'round';
      for (let i = 0; i < 14; i++){
        const seed = i * 37.7 + Math.floor(G.t * 20) * 11;
        const side = i % 2 ? 1 : -1;
        const y = HORIZON + ((seed * 53) % 500);
        const len = 40 + (seed % 60);
        const xx = LW * .5 + side * (150 + (seed % 130));
        ctx.globalAlpha = sp * .5 * (1 - (y - HORIZON) / 520);
        ctx.lineWidth = 2 + (seed % 3);
        ctx.beginPath(); ctx.moveTo(xx, y); ctx.lineTo(xx + side * 6, y + len); ctx.stroke();
      }
      ctx.restore();
    }

    if (G.state !== 'over'){
      const blink = G.inv > 0 && Math.floor(G.t * 10) % 2 === 0;
      ctx.globalAlpha = blink ? .32 : 1;
      drawKart();
      ctx.globalAlpha = 1;
    }

    // 粒子
    for (const p of parts){
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      if (p.ring){
        const k = 1 - p.life / p.max;
        const rx = lerp(p.ring[0], p.ring[1], Math.pow(k, .6)), ry = rx * .30;
        ctx.strokeStyle = p.col; ctx.lineWidth = Math.max(1, p.size * a);
        ctx.beginPath(); ctx.ellipse(p.x, p.y, rx, ry, 0, 0, 7); ctx.stroke();
      } else {
        ctx.fillStyle = p.col;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (.4 + a * .8), 0, 7); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // 飘字
    for (const p of pops){
      const a = 1 - p.life / p.max;
      ctx.globalAlpha = Math.max(0, a);
      ctx.font = '900 26px "Microsoft YaHei",system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.95)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }

    // 场景横幅
    if (G.banner){
      const k = G.banner.t, L = G.banner.life;
      const a = k < .35 ? k / .35 : (k > L - .5 ? (L - k) / .5 : 1);
      const y = 196 + (1 - Math.min(1, k / .35)) * -26;
      ctx.save();
      ctx.globalAlpha = clamp(a, 0, 1);
      ctx.font = '900 27px "Microsoft YaHei",system-ui,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const bw = ctx.measureText(G.banner.text).width + 54;
      ctx.fillStyle = 'rgba(255,255,255,.94)';
      rr(ctx, LW / 2 - bw / 2, y - 25, bw, 50, 25); ctx.fill();
      ctx.strokeStyle = 'rgba(255,150,190,.95)'; ctx.lineWidth = 3;
      rr(ctx, LW / 2 - bw / 2, y - 25, bw, 50, 25); ctx.stroke();
      ctx.fillStyle = '#ff5f9b';
      ctx.fillText(G.banner.text, LW / 2, y + 1);
      ctx.textBaseline = 'alphabetic';
      ctx.restore();
    }

    // 气泡
    if (bubble && G.state === 'play'){
      const bx = LW * .5 + P.x * LANE_U + (P.x > .35 ? -70 : 70);
      const by = BASE_Y - 160 - P.y + Math.sin(G.t * 6) * 3;
      const a = Math.min(1, (bubble.life - bubble.t) * 3);
      ctx.globalAlpha = clamp(a, 0, 1);
      ctx.font = '900 22px "Microsoft YaHei",system-ui,sans-serif';
      const w = ctx.measureText(bubble.text).width + 30;
      ctx.fillStyle = '#fff';
      rr(ctx, bx - w / 2, by - 24, w, 44, 22); ctx.fill();
      ctx.beginPath(); ctx.moveTo(bx - 8, by + 18); ctx.lineTo(bx + 8, by + 18); ctx.lineTo(bx - 2, by + 32); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e2568f'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(bubble.text, bx, by - 1);
      ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;
    }

    ctx.restore();

    // 时停滤镜
    if (G.zw > 0){
      ctx.save();
      ctx.fillStyle = 'rgba(126,96,230,.20)';
      ctx.fillRect(0, 0, LW, LH);
      const vg = ctx.createRadialGradient(LW / 2, LH / 2, LH * 0.22, LW / 2, LH / 2, LH * 0.72);
      vg.addColorStop(0, 'rgba(70,40,150,0)');
      vg.addColorStop(1, 'rgba(62,32,140,.42)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, LW, LH);
      ctx.restore();
    }
    if (G.zwFlash > 0){
      const a = clamp(G.zwFlash / 1.4, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = '900 56px "Microsoft YaHei",system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(255,255,255,.92)';
      ctx.strokeText('THE WORLD', LW / 2, LH * 0.3);
      ctx.fillStyle = '#7b61ff';
      ctx.fillText('THE WORLD', LW / 2, LH * 0.3);
      ctx.restore();
      ctx.textAlign = 'left';
    }

    if (G.flash > 0){
      ctx.fillStyle = 'rgba(255,120,170,' + (G.flash * .5) + ')';
      ctx.fillRect(0, 0, LW, LH);
    }
  }

  /* ================= 主循环 ================= */
  let last = performance.now();
  function loop(now){
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    if (thumbMode){
      render();               // 缩略图模式：冻结画面，只重绘
      requestAnimationFrame(loop);
      return;
    }
    if (G.state === 'dying'){
      G.dyingT -= dt; updateParticles(dt);
      if (G.dyingT <= 0) gameOver();
    } else update(dt);
    render();
    requestAnimationFrame(loop);
  }

  /* ================= 启动 ================= */
  function boot(){
    resize();
    updateBestLabels(); updateHearts(); updateBuffs();
    applyAvatar(myAvatar);
    if (PORTAL){
      const b1 = document.getElementById('btnBoard'), b2 = document.getElementById('btnOverBoard');
      if (b1) b1.style.display = 'none';
      if (b2) b2.style.display = 'none';
      const nr = document.querySelector('.nameRow');
      if (nr) nr.style.display = 'none';
    }
    if (!PORTAL) setTimeout(flushPending, 1500);
    if (POKI){ document.body.classList.add('poki'); paintPageBG(BIOMES[0]); }

    // Poki：初始化 SDK，加载完成后立刻告知（否则影响转化率统计）
    if (POKI){
      try {
        if (typeof PokiSDK !== 'undefined' && PokiSDK && PokiSDK.init){
          PokiSDK.init().then(() => pk('loaded')).catch(() => pk('loaded'));
        } else {
          pk('loaded');
        }
      } catch(e){ pk('loaded'); }
    }

    const q = location.search;
    const shotParam = (q.match(/shot=(\w+)/) || [])[1] || '';
    const quick = !!shotParam || q.indexOf('demo') >= 0;
    window.__lbDebug = !!shotParam;
    if (quick){
      document.head.insertAdjacentHTML('beforeend', '<style>*{transition:none!important;animation:none!important}</style>');
      const dbg = document.createElement('div');
      dbg.id = 'dbg';
      dbg.style.cssText = 'position:absolute;bottom:2px;left:4px;font:10px monospace;color:#222;z-index:99;max-width:100%';
      document.body.appendChild(dbg);
      window.onerror = (m, s, l) => { dbg.textContent = 'ERR ' + m + ' @' + l; };
      window.__dbg = dbg;
    }
    // 调试：模拟选图流程（canvas → Blob → File → 同一条处理链路）
    if (q.indexOf('photo=1') >= 0){
      const c = document.createElement('canvas'); c.width = c.height = 240;
      const g = c.getContext('2d');
      const gr = g.createLinearGradient(0, 0, 240, 240);
      gr.addColorStop(0, '#6aa9ff'); gr.addColorStop(1, '#ff8fd0');
      g.fillStyle = gr; g.fillRect(0, 0, 240, 240);
      g.fillStyle = '#fff'; g.font = 'bold 120px system-ui,sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('喵', 120, 130);
      c.toBlob(function(b){ processAvatarFile(new File([b], 'test.png', { type: 'image/png' })); }, 'image/png');
    }
    if (shotParam === 'board'){      document.getElementById('scrStart').style.display = 'none';
      show('scrBoard');
      openBoard();
    }
    if (shotParam === 'play' || shotParam === 'over' || q.indexOf('demo') >= 0){
      reset(); G.state = 'play';
      document.getElementById('scrStart').style.display = 'none';
      hide('scrStart');
      G.dist = 268; G.stars = 7; G.speed = 26; G.graceT = 4;
      const dm = q.match(/d=(\d+)/); if (dm) G.dist = parseInt(dm[1], 10);
      const stq = (q.match(/state=(\w+)/) || [])[1] || '';
      if (stq === 'jump'){ P.air = true; P.vy = 40; P.y = 150; }
      else if (stq === 'slide'){ P.slide = .42; P.crouch = 1; }
      const spread = [[-1, 12, 'wall'], [0, 12, 'hurdle'], [1, 12, 'bar'], [-1, 26, 'cone'], [1, 26, 'cat'], [0, 7, 'slow']];
      for (const [l, z, k] of spread) addObj(k, l, z);
      addObj('star', 0, 16); addObj('star', 0, 11); addObj('shield', 1, 4); addObj('magnet', -1, 8);
      addObj('train', 1, 20, { len: 16, long: true });
      say('稳稳的');
      updateScore(true);
      if (q.indexOf('zw=1') >= 0){ G.zw = ZW_TIME; G.zwFlash = 1.6; }
      if (q.indexOf('over') < 0 && q.indexOf('thumb=1') >= 0){
        // Poki 缩略图用：干净构图，无 HUD、无文字气泡
        thumbMode = true;
        document.getElementById('hud').style.display = 'none';
        const tt = document.getElementById('toast'); if (tt) tt.style.display = 'none';
        objs = []; pops = []; parts = []; bubble = null;
        G.dist = 210; G.graceT = 99; G.spawnT = 999;
        addObj('hurdle', -1, 9);
        addObj('cat', 1, 7);
        addObj('star', 0, 5); addObj('star', 0, 12); addObj('star', -1, 15);
        addObj('crate', 1, 14);
        addObj('cone', -1, 19);
        P.tx = 0.0; P.x = 0.0;
      }
      if (shotParam === 'over'){ G.dist = 806; G.stars = 23; G.best = (q.indexOf('nb=1') >= 0 ? 99999 : 520); updateScore(true); gameOver(); }
    }
    if (q.indexOf('test=1') >= 0){
      const out = [];
      const runCase = (kind, action, label) => {
        reset(); G.state = 'play'; G.graceT = 0; G.spawnT = 999; G.inv = 0;
        objs = []; addObj(kind, 0, 6);
        let done = false;
        for (let i = 0; i < 150; i++){
          if (!done && objs.length && objs[0].z < 4.2){ action(); done = true; }
          update(1 / 60);
          if (G.state !== 'play') break;
        }
        out.push(label + ':' + (G.lives === 3 ? 'PASS' : 'FAIL(lives=' + G.lives + ')'));
      };
      runCase('hurdle', () => doJump(), 'jump-hurdle');
      runCase('bar', () => doSlide(), 'slide-bar');
      runCase('wall', () => move(1), 'dodge-wall');
      // 不跳不滑应该撞
      reset(); G.state = 'play'; G.graceT = 0; G.spawnT = 999; G.inv = 0;
      objs = []; addObj('hurdle', 0, 6);
      for (let i = 0; i < 150; i++) update(1 / 60);
      out.push('noinput:' + (G.lives === 2 ? 'PASS' : 'FAIL(lives=' + G.lives + ')'));
      // 磁铁：三条道的星星都应该被吸过来
      reset(); G.state = 'play'; G.graceT = 0; G.spawnT = 999; G.inv = 0;
      objs = [];
      for (const l of [-1, 0, 1]) for (let k = 0; k < 3; k++) addObj('star', l, 8 + k * 4);
      G.magnet = 9;
      for (let i = 0; i < 180; i++) update(1 / 60);
      out.push('magnet:' + (G.stars >= 8 ? 'PASS' : 'FAIL(stars=' + G.stars + ')'));
      // 时停：世界推进速度应显著变慢
      reset(); G.state = 'play'; G.graceT = 0; G.spawnT = 999; G.inv = 0;
      objs = []; addObj('cone', -1, 40);
      let za = objs[0].z;
      for (let i = 0; i < 30; i++) update(1 / 60);
      const dzN = za - objs[0].z;
      reset(); G.state = 'play'; G.graceT = 0; G.spawnT = 999; G.inv = 0;
      objs = []; addObj('cone', -1, 40); G.zw = 5;
      let zb = objs[0].z;
      for (let i = 0; i < 30; i++) update(1 / 60);
      const dzS = zb - objs[0].z;
      out.push('zw:' + (dzS < dzN * 0.6 ? 'PASS' : 'FAIL(' + dzS.toFixed(2) + '/' + dzN.toFixed(2) + ')'));
      window.__dbg.textContent = out.join('  ');
      reset(); G.state = 'ready';
    }
    if (q.indexOf('fast') >= 0){
      const log = [];
      try {
        for (let i = 0; i < 9000; i++){
          if (G.state === 'dying'){ G.dyingT = 0; gameOver(); G.state = 'play'; G.lives = 3; }
          update(1 / 60);
          if (i % 40 === 0) move(Math.random() < .5 ? -1 : 1);
          if (i % 33 === 0) (Math.random() < .5 ? doJump : doSlide)();
          if (i % 900 === 0) log.push(Math.floor(G.dist) + 'm/L' + G.lives + '/n' + objs.length + '/b' + G.biome);
        }
        window.__dbg.textContent = 'OK ' + log.join(' ') + ' final=' + Math.floor(G.dist) + ' score=' + G.score;
      } catch (e){
        window.__dbg.textContent = 'ERR ' + e.message + ' | ' + String(e.stack).split('\n')[1];
      }
    }
    requestAnimationFrame(loop);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
