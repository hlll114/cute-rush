<meta name="keywords" content="可爱冲刺,Cute Rush,跑酷,跑酷游戏,跳跃,滑铲,网页游戏,手机小游戏,地铁跑酷">

<title>可爱冲刺 · Cute Rush 跑酷版</title>
<style>
  :root{
    --pink:#ff5f9b;
    --pink-l:#ffa6cd;
    --deep:#6b4d7a;
    --ff:'PingFang SC','Microsoft YaHei UI','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#f3e6f4}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:var(--ff);color:var(--deep);
    background:
      radial-gradient(circle at 18% 12%, #ffe1f0 0 26%, transparent 60%),
      radial-gradient(circle at 82% 22%, #dcefff 0 24%, transparent 58%),
      radial-gradient(circle at 60% 88%, #e2fff3 0 26%, transparent 60%),
      #f6ecf8;
  }
  body.poki #app{border-radius:0;box-shadow:none;isolation:isolate}
  #app{
    position:relative;aspect-ratio:9/16;width:min(100vw,calc(100dvh * 9 / 16));max-height:100dvh;
    border-radius:22px;overflow:hidden;isolation:isolate;
    box-shadow:0 26px 60px rgba(122,72,110,.28), 0 0 0 8px rgba(255,255,255,.75);
    background:#cfe9ff;
  }
  canvas#game{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;padding:26px 14px 12px;display:flex;justify-content:space-between;align-items:flex-start;z-index:3}
  #left{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  #lives{display:flex;gap:5px;font-size:23px;line-height:1;filter:drop-shadow(0 2px 3px rgba(180,60,110,.35))}
  #lives .h{color:#ff4f92;transition:transform .18s,opacity .25s}
  #lives .h.off{opacity:.26;filter:grayscale(1) brightness(1.4);transform:scale(.86)}
  #lives.pulse .h{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.42)}100%{transform:scale(1)}}
  #pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.82);
    border-radius:999px;padding:3px 12px;font-size:13px;font-weight:800;color:#a2588a;
    box-shadow:0 3px 8px rgba(160,80,130,.18);width:max-content}
  #buffs{display:flex;flex-direction:column;gap:5px}
  .buff{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.88);border-radius:999px;
    padding:2px 8px;font-size:12px;font-weight:800;color:#a2588a;box-shadow:0 3px 8px rgba(160,80,130,.16)}
  .buff .bar{width:42px;height:5px;border-radius:3px;background:#ffd7e6;overflow:hidden}
  .buff .bar i{display:block;height:100%;width:100%;background:#ff6aa8;border-radius:3px}
  #right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  #score{font-size:34px;font-weight:900;color:#fff;letter-spacing:.5px;
    -webkit-text-stroke:6px #ff74aa;paint-order:stroke fill;
    text-shadow:0 4px 0 rgba(226,86,143,.55);line-height:1;font-variant-numeric:tabular-nums}
  #score.bump{animation:pop .22s ease}
  #btns{display:flex;gap:8px;pointer-events:auto}
  .icon{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.86);font-size:17px;
    display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 10px rgba(160,80,130,.22);color:#c0558c;
    transition:transform .1s}
  .icon:active{transform:scale(.92)}

  /* ---------- screens ---------- */
  .screen{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;padding:22px 26px;text-align:center;overflow-y:auto;
    background:linear-gradient(180deg,rgba(255,240,248,.62),rgba(226,240,255,.72));
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);transition:opacity .28s}
  .screen.hidden{opacity:0;pointer-events:none}
  .hero{width:124px;height:124px;border-radius:50%;object-fit:cover;
    box-shadow:0 12px 26px rgba(200,90,150,.35),0 0 0 6px #fff;animation:float 3.2s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
  h1{margin:2px 0 0;font-size:40px;line-height:1.12;font-weight:900;letter-spacing:1px;color:#ff5f9b;
    text-shadow:0 3px 0 #fff,0 6px 0 rgba(255,180,210,.9),0 12px 22px rgba(255,95,155,.32)}
  h1 small{display:block;font-size:13px;letter-spacing:5px;color:#b0759f;text-shadow:none;margin-top:6px;font-weight:800}
  .tip{font-size:13.5px;line-height:1.7;color:#8b6b93;max-width:340px;margin:2px 0}
  .tip b{color:#e2568f}
  .keys{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:2px}
  .kbd{background:#fff;border-radius:10px;padding:5px 10px;font-weight:900;font-size:12px;color:#c0558c;
    box-shadow:0 3px 0 #f0c9dd,0 6px 12px rgba(200,110,160,.18)}
  .btn{border:0;border-radius:999px;padding:14px 44px;font-size:19px;font-weight:900;letter-spacing:2px;color:#fff;
    font-family:inherit;cursor:pointer;
    background:linear-gradient(180deg,#ffa1cb,#ff5f9b);
    box-shadow:0 7px 0 #dd4a86,0 14px 26px rgba(255,95,155,.4);
    transition:transform .08s,box-shadow .08s;margin-top:4px}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 #dd4a86,0 6px 14px rgba(255,95,155,.4)}
  .btn.ghost{background:linear-gradient(180deg,#fff,#ffe9f3);color:#e2568f;box-shadow:0 7px 0 #f2c6dc,0 14px 22px rgba(220,140,180,.25);
    font-size:15px;padding:11px 26px;letter-spacing:1px}
  .btn.ghost:active{box-shadow:0 2px 0 #f2c6dc}
  .card{background:rgba(255,255,255,.82);border-radius:20px;padding:12px 22px;display:flex;gap:22px;
    box-shadow:0 10px 24px rgba(180,110,160,.18)}
  .card div{display:flex;flex-direction:column;gap:3px}
  .card span{font-size:11px;letter-spacing:1px;color:#ad85a0;font-weight:800}
  .card b{font-size:22px;color:#e2568f;font-weight:900;font-variant-numeric:tabular-nums}
  .bigscore{font-size:60px;font-weight:900;color:#ff5f9b;line-height:1;
    -webkit-text-stroke:8px #fff;paint-order:stroke fill;text-shadow:0 8px 0 rgba(255,180,210,.8)}
  .newrec{font-size:14px;font-weight:900;color:#fff;background:linear-gradient(90deg,#ffb347,#ff6aa8);
    padding:5px 16px;border-radius:999px;box-shadow:0 5px 12px rgba(255,140,90,.35);animation:pop 1s ease infinite}
  /* 之前 .hidden 只作用于 .screen，导致「新纪录」永远显示 —— 这里补上 */
  .newrec.hidden{display:none}
  .biomes{display:flex;gap:6px;justify-content:center;font-size:11px;color:#9b7aa4;font-weight:800;flex-wrap:wrap;max-width:330px}

  /* ---------- 头像 / 昵称 / 排行榜 ---------- */
  .heroWrap{position:relative;display:inline-block}
  .heroEdit{position:absolute;right:-10px;bottom:-6px;border:0;background:linear-gradient(180deg,#ffa1cb,#ff5f9b);
    color:#fff;font-size:11px;font-weight:900;padding:6px 12px;border-radius:999px;cursor:pointer;
    font-family:inherit;box-shadow:0 4px 10px rgba(220,80,140,.35);letter-spacing:.5px}
  .heroEdit:active{transform:scale(.94)}
  .nameRow{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border-radius:999px;
    padding:6px 10px 6px 14px;box-shadow:0 6px 16px rgba(180,110,160,.18)}
  .nameRow span{font-size:12px;font-weight:900;color:#b0759f;white-space:nowrap}
  #nameInput{border:0;background:transparent;font-family:inherit;font-size:15px;font-weight:900;color:#e2568f;
    width:140px;outline:none;text-align:left;padding:2px 0}
  #nameInput::placeholder{color:#e8b6d4;font-weight:700}
  .btn.small{font-size:13px;padding:9px 18px;letter-spacing:.5px}
  .board{width:100%;max-width:360px;max-height:42vh;overflow-y:auto;background:rgba(255,255,255,.94);
    border-radius:18px;padding:8px;box-shadow:0 12px 28px rgba(180,110,160,.22);-webkit-overflow-scrolling:touch}
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-bottom:4px}
  .pod{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;width:86px;
    padding:6px 4px 8px;overflow:hidden;border-radius:16px 16px 6px 6px;
    background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,236,246,.97));
    box-shadow:0 -4px 14px rgba(180,110,160,.18)}
  .pod.p1{height:124px}.pod.p2{height:108px}.pod.p3{height:98px}
  .pod img,.pod .avph{width:42px;height:42px;border-radius:50%;flex:0 0 auto}
  .pod.p1 img,.pod.p1 .avph{box-shadow:0 0 0 3px #ffd54a}
  .pod.p2 img,.pod.p2 .avph{box-shadow:0 0 0 3px #cfd6e6}
  .pod.p3 img,.pod.p3 .avph{box-shadow:0 0 0 3px #e8b183}
  .pod .pnm{font-size:10px;line-height:1.15;font-weight:900;color:#6b4d7a;max-width:78px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pod b{font-size:13px;color:#e2568f;font-weight:900;line-height:1}
  .pod .medal{font-size:12px;line-height:1}
  .btnrow{display:flex;gap:8px}
  .brow{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:12px;font-size:14px}
  .brow.me{background:#ffe9f3;box-shadow:inset 0 0 0 2px #ffc2dd}
  .brow .rk{width:22px;text-align:center;font-weight:900;color:#c9a0bb;font-size:13px;flex:0 0 auto}
  .brow .rk.t1{color:#ffab00}.brow .rk.t2{color:#9fa6c0}.brow .rk.t3{color:#d08a5a}
  .brow img{width:30px;height:30px;border-radius:50%;background:#ffd9ea;object-fit:cover;flex:0 0 auto;
    box-shadow:0 2px 6px rgba(180,110,160,.25)}
  .avph{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    background:linear-gradient(180deg,#ffc2dd,#ff8fbb);color:#fff;font-size:13px;font-weight:900;
    box-shadow:0 2px 6px rgba(180,110,160,.25)}
  .brow .nm{flex:1;font-weight:800;color:#6b4d7a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
  .brow .sc{font-weight:900;color:#e2568f;font-variant-numeric:tabular-nums}
  .empty{color:#b09ab5;font-size:13px;padding:20px 10px;text-align:center;line-height:1.7}
  .rankLine{font-size:14px;font-weight:900;color:#c0558c;min-height:20px}
  .toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:rgba(60,40,70,.88);
    color:#fff;font-size:13px;font-weight:800;padding:9px 18px;border-radius:999px;z-index:20;
    opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:90%}

  /* ---------- 手势提示（不再有屏幕按键，只能滑动） ---------- */
</style>

</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <noscript><div style="position:absolute;inset:0;display:grid;place-items:center;background:#fff0f7;color:#c0558c;font:600 16px/1.7 'Microsoft YaHei',sans-serif;text-align:center;padding:30px;z-index:9">需要开启 JavaScript 才能开跑哦～<br>请在浏览器设置里允许本页面运行脚本。</div></noscript>

  <div id="hud">
    <div id="left">
      <div id="lives"></div>
      <div id="pill"><span id="dist">0 m</span></div>
      <div id="buffs"></div>
    </div>
    <div id="right">
      <div id="score">0</div>
      <div id="btns">
        <button class="icon" id="btnMute" title="声音">🔊</button>
        <button class="icon" id="btnPause" title="暂停">⏸</button>
      </div>
    </div>
  </div>

  <input type="file" id="fileAvatar" accept="image/*" style="display:none">

  <div class="screen" id="scrStart">
    <div class="heroWrap">
      <img class="hero" id="hero" alt="主角">
      <button class="heroEdit" id="btnAvatar">换头像</button>
    </div>
    <h1>可爱冲刺<small>CUTE RUSH · 跑酷版</small></h1>
    <div class="nameRow"><span>昵称</span><input id="nameInput" maxlength="10" placeholder="取个名字上榜"></div>
    <p class="tip"><b>手机：手指滑动</b> — 左右滑变道、上滑跳、下滑铲<br>电脑：← → 变道 · ↑ / 空格 跳 · ↓ 铲<br>⭐加分 · ❤回血 · 护盾挡一次撞击 · 磁铁吸星星</p>
    <div class="keys"><span class="kbd">← → 变道</span><span class="kbd">↑ / 空格 跳</span><span class="kbd">↓ 铲</span></div>
    <button class="btn" id="btnStart">开 始 奔 跑</button>
    <button class="btn ghost small" id="btnBoard">🏆 全球排行榜</button>
    <div class="card" style="margin-top:2px"><div><span>最高分</span><b id="bestStart">0</b></div><div><span>最远距离</span><b id="bestDist">0 m</b></div></div>
    <div class="biomes">糖果公园 · 樱花小径 · 霓虹夜街 · 海边公路 · 云端幻境 · <span style="opacity:.6">v8</span></div>
  </div>

  <div class="screen hidden" id="scrBoard">
    <h1 style="font-size:26px">🏆 全球排行榜</h1>
    <div class="podium" id="podium"></div>
    <div class="board" id="boardList"></div>
    <div class="rankLine" id="boardTip"></div>
    <div class="btnrow">
      <button class="btn ghost small" id="btnBoardRefresh">刷 新</button>
      <button class="btn ghost small" id="btnBoardBack">返 回</button>
    </div>
  </div>

  <div class="screen hidden" id="scrOver">
    <img class="hero" id="hero2" alt="" style="width:90px;height:90px">
    <h1 style="font-size:30px" id="overTitle">撞到啦！</h1>
    <div class="bigscore" id="finalScore">0</div>
    <div class="newrec hidden" id="newRecord">🎉 新纪录！</div>
    <div class="rankLine" id="rankLine"></div>
    <div class="card"><div><span>距离</span><b id="finalDist">0 m</b></div><div><span>星星</span><b id="finalCoins">0</b></div><div><span>最高分</span><b id="bestOver">0</b></div></div>
    <button class="btn" id="btnRetry">再 来 一 次</button>
    <button class="btn ghost small" id="btnOverBoard">🏆 看排行榜</button>
    <button class="btn ghost small" id="btnHome">返回首页</button>
  </div>

  <div class="screen hidden" id="scrPause">
    <h1 style="font-size:32px">暂停中…</h1>
    <p class="tip">喘口气，顺便整理一下发型</p>
    <button class="btn" id="btnResume">继 续</button>
    <button class="btn ghost" id="btnRestart">重新开始</button>
  </div>
</div>

  // Poki 宽屏：让页面底色跟当前场景一致，避免出现"浮在粉色背景上的竖条"
  function paintPageBG(bi){
    if (!POKI || !bi) return;
    document.body.style.background =
      'linear-gradient(165deg,' + bi.sky[0] + ' 0%,' + bi.sky[1] + ' 40%,' +
      bi.ground[0] + ' 62%,' + bi.road[1] + ' 100%)';
  }

  /* ===== Poki SDK 事件 ===== */
  function pk(ev){
    if (!POKI) return null;
    try {
      if (typeof PokiSDK === 'undefined' || !PokiSDK) return null;
      if (ev === 'start') PokiSDK.gameplayStart();
      else if (ev === 'stop') PokiSDK.gameplayStop();
      else if (ev === 'loaded') PokiSDK.gameLoadingFinished();
      else if (ev === 'break') return PokiSDK.commercialBreak();
    } catch(e){}
    return null;
  }
  // 广告插播后继续；6 秒兜底，避免广告 SDK 异常时卡死
  function withBreak(next){
    if (!POKI){ next(); return; }
    let done = false;
    const go = () => { if (!done){ done = true; next(); } };
    try {
      if (typeof PokiSDK !== 'undefined' && PokiSDK && PokiSDK.commercialBreak){
        PokiSDK.commercialBreak().then(go).catch(go);
        setTimeout(go, 6000);
      } else { go(); }
    } catch(e){ go(); }
  }   // true = 平台版（4399 等），关闭一切外部网络请求

  /* ================= 基础 ================= */
  const LW = 540, LH = 960;
  const HORIZON = 380;
  const BASE_Y  = 906;
  const CAM = 4.6;
  const LANE_U = 150;
  const ROAD_EDGE = 1.55;
  const SPAWN_Z = 52;
  const HIT_Z = 1.05;
  const GRAV = 2650, JUMP_V = 960;
  const SEG = 620;                 // 每个场景多少米

  const proj = z => CAM / (CAM + z);
  const yOf  = z => HORIZON + (BASE_Y - HORIZON) * proj(z);
  const xOf  = (off, z) => LW * 0.5 + off * LANE_U * proj(z);
  const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
  const rnd = (a,b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const lerp = (a,b,t) => a + (b - a) * t;

  function hex2rgb(h){ h = h.replace('#',''); if (h.length === 3) h = h.split('').map(c => c + c).join('');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
  function mixHex(a, b, t){ const A = hex2rgb(a), B = hex2rgb(b); t = clamp(t, 0, 1);
    return 'rgb(' + Math.round(lerp(A[0],B[0],t)) + ',' + Math.round(lerp(A[1],B[1],t)) + ',' + Math.round(lerp(A[2],B[2],t)) + ')'; }
  function alphaHex(hex, a){ const [r,g,b] = hex2rgb(hex); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; }

  const app = document.getElementById('app');
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d', { alpha: false });
  let scale = 1, dpr = 1;

  function resize(){
    const r = app.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    scale = cv.width / LW;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  function tone(freq, dur, type, vol, slideTo, delay){

    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    o.start(t0); o.stop(t0 + dur + 0.03);

  /* ================= 背景预渲染（按场景，懒加载 + 缓存） ================= */

        b.fillStyle = 'rgba(20,14,48,.92)';
        b.fillRect(x, HORIZON - h, w, h + 12);
        for (let wy = HORIZON - h + 10; wy < HORIZON - 6; wy += 14){

          }
        }
      }
    }

    bgCache.set(bi.key, c);
    if (bgCache.size > 3) bgCache.delete(bgCache.keys().next().value);

  }

  /* ================= 场景相位 ================= */
  function biomePhase(){
    const raw = G.dist / SEG;
    const i = Math.floor(raw) % BIOMES.length;
    const frac = raw - Math.floor(raw);
    const T = 90 / SEG;                       // 最后 90 米做过渡
    const t = frac > 1 - T ? (frac - (1 - T)) / T : 0;
    return { i, next: (i + 1) % BIOMES.length, t: clamp(t, 0, 1) };
  }

  /* ================= 绘制工具 ================= */
  function rr(c, x, y, w, h, r){
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function starPath(c, r, inner, n, rot){
    c.beginPath();
    for (let i = 0; i < n * 2; i++){
      const ang = (rot || -Math.PI / 2) + i * Math.PI / n;
      const rr2 = i % 2 ? r * (inner || .45) : r;
      const x = Math.cos(ang) * rr2, y = Math.sin(ang) * rr2;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.closePath();
  }
  function heartPath(c, s){
    c.beginPath();
    c.moveTo(0, s * .32);
    c.bezierCurveTo(-s * 1.15, -s * .42, -s * .5, -s * 1.1, 0, -s * .45);
    c.bezierCurveTo(s * .5, -s * 1.1, s * 1.15, -s * .42, 0, s * .32);
    c.closePath();
  }
  function face(c, x, y, s, mode){
    c.fillStyle = '#3d2b46';
    if (mode === 'wow'){
      c.beginPath(); c.arc(x - 6 * s, y, 3.2 * s, 0, 7); c.fill();
      c.beginPath(); c.arc(x + 6 * s, y, 3.2 * s, 0, 7); c.fill();
      c.fillStyle = '#4a3450';
      c.beginPath(); c.ellipse(x, y + 7 * s, 3.6 * s, 4.4 * s, 0, 0, 7); c.fill();
    } else if (mode === 'happy'){
      c.lineWidth = 2.6 * s; c.strokeStyle = '#3d2b46'; c.lineCap = 'round';
      c.beginPath(); c.arc(x - 6 * s, y, 4 * s, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
      c.beginPath(); c.arc(x + 6 * s, y, 4 * s, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
    } else {
      c.beginPath(); c.arc(x - 6 * s, y, 2.6 * s, 0, 7); c.fill();
      c.beginPath(); c.arc(x + 6 * s, y, 2.6 * s, 0, 7); c.fill();
      c.fillStyle = 'rgba(255,255,255,.85)';
      c.beginPath(); c.arc(x - 6.9 * s, y - .9 * s, .9 * s, 0, 7); c.fill();
      c.beginPath(); c.arc(x + 5.1 * s, y - .9 * s, .9 * s, 0, 7); c.fill();
    }
    c.fillStyle = 'rgba(255,130,170,.45)';
    c.beginPath(); c.ellipse(x - 12 * s, y + 5 * s, 4.2 * s, 2.6 * s, 0, 0, 7); c.fill();
    c.beginPath(); c.ellipse(x + 12 * s, y + 5 * s, 4.2 * s, 2.6 * s, 0, 0, 7); c.fill();
    if (mode !== 'wow'){
      c.strokeStyle = '#3d2b46'; c.lineWidth = 2 * s; c.lineCap = 'round';
      c.beginPath(); c.arc(x, y + 5 * s, 3.4 * s, .2, Math.PI - .2); c.stroke();
    }

  /* ================= 路面 ================= */
  function band(c, o1, o2, z1, z2, color){
    const y1 = yOf(z1), y2 = yOf(z2);
    c.beginPath();
    c.moveTo(xOf(o1, z1), y1);
    c.lineTo(xOf(o2, z1), y1);
    c.lineTo(xOf(o2, z2), y2);
    c.lineTo(xOf(o1, z2), y2);
    c.closePath(); c.fillStyle = color; c.fill();
  }

  function drawRoad(bi, biN, t){
    const ZMAX = 320;
    const roadTop = mixHex(bi.road[0], biN.road[0], t);
    const roadBot = mixHex(bi.road[1], biN.road[1], t);
    const g = ctx.createLinearGradient(0, HORIZON, 0, LH);
    g.addColorStop(0, roadTop); g.addColorStop(.35, roadTop); g.addColorStop(1, roadBot);
    ctx.beginPath();
    ctx.moveTo(xOf(-ROAD_EDGE, -2), yOf(-2));
    ctx.lineTo(xOf(ROAD_EDGE, -2), yOf(-2));
    ctx.lineTo(xOf(ROAD_EDGE, ZMAX), yOf(ZMAX));
    ctx.lineTo(xOf(-ROAD_EDGE, ZMAX), yOf(ZMAX));
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();

    const cA = mixHex(bi.curb[0], biN.curb[0], t);
    const cB = mixHex(bi.curb[1], biN.curb[1], t);
    const CS = 5, off = G.dist % CS;
    for (let i = 0; i < 90; i++){
      const z1 = i * CS - off, z2 = z1 + CS;
      if (z2 < -2) continue;
      const col = ((Math.floor(G.dist / CS) + i) % 2) ? cA : cB;
      band(ctx, ROAD_EDGE, ROAD_EDGE + .22, Math.max(z1, -2), z2, col);
      band(ctx, -ROAD_EDGE - .22, -ROAD_EDGE, Math.max(z1, -2), z2, col);
    }
    const laneCol = mixHex(bi.lane, biN.lane, t);
    const D = 6, doff = G.dist % D;
    for (let i = 0; i < 70; i++){
      const z1 = i * D - doff, z2 = z1 + 3;
      if (z2 < -1) continue;
      ctx.globalAlpha = clamp(proj(z1) * 1.6, 0, 1) * .9;
      band(ctx, -.5 - .022, -.5 + .022, z1, z2, laneCol);
      band(ctx, .5 - .022, .5 + .022, z1, z2, laneCol);
      ctx.globalAlpha = 1;
    }
    band(ctx, ROAD_EDGE - .04, ROAD_EDGE, -2, 220, 'rgba(255,255,255,.55)');
    band(ctx, -ROAD_EDGE, -ROAD_EDGE + .04, -2, 220, 'rgba(255,255,255,.55)');
  }

  /* ================= 路边风景 ================= */
  function drawScenery(bi, darkAmt){
    const S = 13, off = G.dist % S;
    for (let i = 0; i < 30; i++){
      const z = i * S - off;
      if (z < -1 || z > 150) continue;
      const s = proj(z) * 1.25, y = yOf(z);
      const idx = Math.floor(G.dist / S) + i;
      for (const side of [-1, 1]){
        const x = xOf(side * (ROAD_EDGE + .32 + ((idx + (side > 0 ? 1 : 0)) % 3) * .07), z);
        ctx.save();
        ctx.translate(x, y); ctx.scale(s, s);
        const k = (idx * 31 + (side > 0 ? 7 : 3)) % 5;
        if (bi.scenery === 'candy') k === 2 ? bush(0,0) : tree(0,0, .8 + (k % 3) * .1, k % 2 ? '#8fe8c4' : '#ffc6dd');
        else if (bi.scenery === 'sakura') k === 2 ? bush(0,0) : tree(0,0, .85 + (k % 3) * .1, k % 3 === 0 ? '#ffd6e8' : '#ffc0da');
        else if (bi.scenery === 'neon') building(0, 0, .9 + (k % 3) * .15, k);
        else if (bi.scenery === 'palm') palm(0, 0, .95 + (k % 3) * .1);
        else cloudHouse(0, 0, .9 + (k % 3) * .1, k);
        ctx.restore();
      }
    }
    if (darkAmt > .01){
      ctx.globalAlpha = darkAmt;
      ctx.fillStyle = '#151038';
      ctx.fillRect(0, 0, LW, LH);
      ctx.globalAlpha = 1;
    }
  }
  function tree(x, y, k, col){
    ctx.fillStyle = '#b87f5f';
    rr(ctx, x - 6 * k, y - 34 * k, 12 * k, 36 * k, 5 * k); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y - 58 * k, 26 * k, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 18 * k, y - 44 * k, 18 * k, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 18 * k, y - 46 * k, 19 * k, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.42)';
    ctx.beginPath(); ctx.arc(x - 8 * k, y - 64 * k, 9 * k, 0, 7); ctx.fill();
    ctx.fillStyle = col === '#8fe8c4' ? '#ff8fbf' : '#fff0f6';
    ctx.beginPath(); ctx.arc(x + 12 * k, y - 52 * k, 3.4 * k, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 14 * k, y - 48 * k, 3 * k, 0, 7); ctx.fill();
  }
  function bush(x, y){
    ctx.fillStyle = '#9de8c8';
    ctx.beginPath(); ctx.arc(x, y - 12, 20, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 18, y - 6, 14, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 18, y - 7, 15, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(x - 5, y - 18, 7, 0, 7); ctx.fill();

  function palm(x, y, k){
    ctx.strokeStyle = '#c58f68'; ctx.lineWidth = 9 * k; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 8 * k, y - 40 * k, x + 2 * k, y - 74 * k); ctx.stroke();
    for (let i = 0; i < 5; i++){
      const a = -Math.PI / 2 + (i - 2) * .55;
      ctx.strokeStyle = i % 2 ? '#5fd6a8' : '#49c795';
      ctx.lineWidth = 10 * k; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x + 2 * k, y - 74 * k);
      ctx.quadraticCurveTo(x + 2 * k + Math.cos(a) * 34 * k, y - 74 * k + Math.sin(a) * 30 * k,
                           x + 2 * k + Math.cos(a) * 52 * k, y - 74 * k + Math.sin(a) * 44 * k + 10 * k);

    ctx.beginPath(); ctx.arc(x + 6 * k, y - 68 * k, 5 * k, 0, 7); ctx.fill();

  function building(x, y, k, seed){
    const w = 54 * k, h = (90 + (seed % 4) * 34) * k;
    ctx.fillStyle = 'rgba(24,17,52,.92)';
    rr(ctx, x - w / 2, y - h, w, h, 6 * k); ctx.fill();
    for (let wy = y - h + 12 * k; wy < y - 10 * k; wy += 20 * k){
      for (let wx = x - w / 2 + 8 * k; wx < x + w / 2 - 8 * k; wx += 14 * k){
        if ((Math.floor(wx + wy + seed * 7) % 3) !== 0){
          ctx.fillStyle = ((Math.floor(wx * 3 + wy + seed)) % 5 === 0) ? 'rgba(255,214,120,.9)' : ((seed % 2) ? 'rgba(255,95,215,.85)' : 'rgba(87,224,255,.85)');
          ctx.fillRect(wx, wy, 6 * k, 8 * k);
        }
      }
    }
    ctx.fillStyle = 'rgba(255,120,220,.85)';
    ctx.fillRect(x - w / 2 + 6 * k, y - h - 6 * k, w - 12 * k, 4 * k);
  }
  function cloudHouse(x, y, k, seed){
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.beginPath();
    ctx.arc(x, y - 34 * k, 26 * k, 0, 7);
    ctx.arc(x - 22 * k, y - 24 * k, 17 * k, 0, 7);
    ctx.arc(x + 22 * k, y - 22 * k, 19 * k, 0, 7);
    ctx.fill();
    ctx.fillStyle = 'rgba(190,170,240,.9)';
    ctx.beginPath(); ctx.arc(x, y - 44 * k, 8 * k, 0, 7); ctx.fill();
  }

  /* ================= 障碍与道具 ================= */
  function shadowEllipse(w, h, a){

  // 锥筒：青绿色（原来是橙色，远看容易和金色星星混，改成对比色）
  function drawCone(){
    shadowEllipse(30, 9, .18);
    ctx.fillStyle = '#178a76'; rr(ctx, -31, -11, 62, 12, 6); ctx.fill();
    ctx.fillStyle = '#4fdcc4'; rr(ctx, -31, -13, 62, 7, 4); ctx.fill();
    const g = ctx.createLinearGradient(-26, 0, 26, 0);

  // 小火车（占一条车道，只能变道躲开）
  const TRAIN_W = .42, TRAIN_H = 152;
  function drawTrain(o){
    const sF = proj(o.z), sB = proj(o.z + o.len);
    const xF = xOf(o.off, o.z), xB = xOf(o.off, o.z + o.len);
    const yF = yOf(o.z), yB = yOf(o.z + o.len);
    const wF = TRAIN_W * LANE_U * sF, wB = TRAIN_W * LANE_U * sB;
    const hF = TRAIN_H * sF, hB = TRAIN_H * sB;

    // 侧面
    ctx.fillStyle = '#e879a8';
    ctx.beginPath();
    ctx.moveTo(xF - wF, yF); ctx.lineTo(xF - wF, yF - hF);
    ctx.lineTo(xB - wB, yB - hB); ctx.lineTo(xB - wB, yB); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#d15f92';
    ctx.beginPath();
    ctx.moveTo(xF + wF, yF); ctx.lineTo(xF + wF, yF - hF);
    ctx.lineTo(xB + wB, yB - hB); ctx.lineTo(xB + wB, yB); ctx.closePath(); ctx.fill();
    // 顶部
    ctx.fillStyle = '#ffb3d1';
    ctx.beginPath();
    ctx.moveTo(xF - wF, yF - hF); ctx.lineTo(xF + wF, yF - hF);
    ctx.lineTo(xB + wB, yB - hB); ctx.lineTo(xB - wB, yB - hB); ctx.closePath(); ctx.fill();
    // 车厢接缝
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2 * sF;
    for (let k = 0.25; k < 1; k += 0.25){
      const zz = o.z + o.len * k, ss = proj(zz), xx = xOf(o.off, zz), yy = yOf(zz);
      ctx.beginPath();
      ctx.moveTo(xx - TRAIN_W * LANE_U * ss, yy - TRAIN_H * ss);
      ctx.lineTo(xx + TRAIN_W * LANE_U * ss, yy - TRAIN_H * ss);
      ctx.stroke();
    }
    // 车头
    const g = ctx.createLinearGradient(0, yF - hF, 0, yF);
    g.addColorStop(0, '#ffc2dd'); g.addColorStop(1, '#ff8fbb');
    ctx.fillStyle = g;
    rr(ctx, xF - wF, yF - hF, wF * 2, hF, 12 * sF); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 4 * sF;
    rr(ctx, xF - wF, yF - hF, wF * 2, hF, 12 * sF); ctx.stroke();
    // 挡风玻璃
    ctx.fillStyle = 'rgba(150,220,255,.85)';
    rr(ctx, xF - wF * .72, yF - hF * .92, wF * 1.44, hF * .34, 8 * sF); ctx.fill();
    // 车灯 + 脸
    ctx.fillStyle = '#fff6c8';
    ctx.beginPath(); ctx.arc(xF - wF * .58, yF - hF * .46, 6 * sF, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(xF + wF * .58, yF - hF * .46, 6 * sF, 0, 7); ctx.fill();
    face(ctx, xF, yF - hF * .56, .95 * sF, 'wow');
  }

  /* ================= 主角 ================= */
  function drawKart(){
    const px = LW * .5 + P.x * LANE_U;
    const grounded = !P.air && P.slide <= 0 && P.crouch < .2;
    const bob = grounded ? Math.sin(G.t * 9) * 2.4 : 0;
    const py = BASE_Y + bob - P.y;
    const lean = clamp((P.tx - P.x) * 1.1, -.3, .3);
    const crouch = P.crouch;
    const st = P.stretch;
    const airRot = P.air ? clamp(-P.vy / 5200, -.16, .2) : 0;

    // 影子：跳得越高越小越淡，滑铲时压扁拉长
    const shs = clamp(1 - P.y / 520, .32, 1);
    ctx.save();
    ctx.globalAlpha = .26 * shs;
    ctx.fillStyle = 'rgb(50,30,70)';
    ctx.beginPath();
    ctx.ellipse(px, BASE_Y + 12, 62 * shs * (1 + crouch * .18), 16 * shs * (1 - crouch * .22), 0, 0, 7);
    ctx.fill();
    ctx.restore();

    // 起跳 / 落地时的速度弧线
    if (P.air || P.stretch < .98){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,' + (P.air ? .38 : .5) + ')';
      ctx.lineWidth = 4; ctx.lineCap = 'round';
      const base = BASE_Y + 6;
      for (let i = 0; i < 3; i++){
        const w = 30 + i * 22, yy = base - i * 9;
        ctx.globalAlpha = (1 - i * .3) * (.55 + Math.sin(G.t * 18 + i) * .2);
        ctx.beginPath(); ctx.moveTo(px - w, yy); ctx.quadraticCurveTo(px, yy + 14, px + w, yy); ctx.stroke();
      }
      ctx.restore();
    }

    // ---- 身体（拉伸 / 压扁，不带动脑袋） ----
    const sy = st * (1 - crouch * .32);
    const sx = (1 / st) * (1 + crouch * .22);
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(lean * .12 + airRot + crouch * .1);
    ctx.scale(sx, sy);

    // 尾翼
    ctx.fillStyle = '#ff8fbf';
    rr(ctx, -60, -50, 120, 15, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    rr(ctx, -60, -50, 120, 5, 3); ctx.fill();

    // 车身
    const g = ctx.createLinearGradient(0, -44, 0, 4);
    g.addColorStop(0, '#ffb2d4'); g.addColorStop(.55, '#ff8fbf'); g.addColorStop(1, '#ff5f9b');
    ctx.fillStyle = g; rr(ctx, -52, -42, 104, 44, 20); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    rr(ctx, -40, -36, 30, 9, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    rr(ctx, -46, -16, 92, 8, 4); ctx.fill();
    // 轮子
    ctx.fillStyle = '#4b3d5e';
    rr(ctx, -64, -18, 15, 24, 7); ctx.fill();
    rr(ctx, 49, -18, 15, 24, 7); ctx.fill();
    ctx.fillStyle = '#8b7aa3';
    rr(ctx, -60, -12, 6, 10, 3); ctx.fill();
    rr(ctx, 53, -12, 6, 10, 3); ctx.fill();
    ctx.restore();

    // 滑铲时的地面拖痕
    if (crouch > .25){
      ctx.save();
      ctx.globalAlpha = .55 * crouch;
      ctx.strokeStyle = 'rgba(255,255,255,.95)';
      ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      for (let i = 0; i < 2; i++){
        const y0 = BASE_Y + 8 + i * 12;
        ctx.beginPath(); ctx.moveTo(px - 44, y0); ctx.lineTo(px - 104 - i * 14, y0 + 28); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(px + 44, y0); ctx.lineTo(px + 104 + i * 14, y0 + 28); ctx.stroke();
      }
      ctx.restore();
    }

    // ---- 脑袋：始终是圆的，只跟着位移 / 旋转 ----
    const headScale = 1 - crouch * .10;
    const headY = -74 * sy + (P.air ? -6 : Math.sin(G.t * 9 + 1) * 1.6) - crouch * 8;
    ctx.save();
    ctx.translate(px + lean * 8, py + headY);
    ctx.rotate(lean * .45 + airRot * 1.3 + crouch * .22);
    const r = 46 * headScale;
    ctx.save();
    ctx.shadowColor = 'rgba(255,120,170,.5)'; ctx.shadowBlur = 20;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, 7); ctx.fill();
    ctx.restore();
    if (headReady){
      ctx.save();
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.clip();
      ctx.drawImage(headImg, -r, -r, r * 2, r * 2);
      ctx.restore();
    } else {
      ctx.fillStyle = '#ffd0e2';
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
      face(ctx, 0, 0, 2.2, 'happy');
    }
    ctx.restore();

    // 护盾光圈
    if (G.shield){
      ctx.save();
      ctx.strokeStyle = 'rgba(120,200,255,.9)'; ctx.lineWidth = 4;
      ctx.shadowColor = 'rgba(120,200,255,.9)'; ctx.shadowBlur = 16;
      ctx.beginPath(); ctx.ellipse(px, py - 42, 82, 96, 0, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(150,215,255,.12)';
      ctx.beginPath(); ctx.ellipse(px, py - 42, 82, 96, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
    // 磁铁光圈
    if (G.magnet > 0){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,140,210,' + (.35 + Math.sin(G.t * 10) * .15) + ')';
      ctx.lineWidth = 3; ctx.setLineDash([10, 10]); ctx.lineDashOffset = -G.t * 60;
      ctx.beginPath(); ctx.ellipse(px, py - 30, 130, 130, 0, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  }

  /* ================= 粒子 / 飘字 / 环境 ================= */
  function burst(x, y, color, n, spd, up){
    for (let i = 0; i < n; i++){
      const a = rnd(0, Math.PI * 2), v = rnd(spd * .35, spd);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (up || 0),
        life: rnd(.35, .75), max: .75, col: color, size: rnd(3, 7), g: 260 });
    }
  }
  // 地面冲击波（扁平圆环）
  function ringBurst(x, y, color, r0, r1, life, lw){
    parts.push({ x, y, vx: 0, vy: 0, life, max: life, col: color, size: lw || 6, g: 0, ring: [r0, r1] });
  }
  function popText(x, y, text, color){
    pops.push({ x, y, text, color: color || '#ffd84f', life: 0, max: .95 });
  }
  function say(text){ bubble = { text, t: 0, life: 1.5 }; }
  const CHEER = ['冲鸭！', '好险～', '哇哦！', '稳稳的', '我最快！', '跳得好！'];

  function spawnAmbient(bi){
    if (ambient.length > 26) return;
    const kind = bi.ambient;
    ambient.push({
      x: rnd(0, LW), y: HORIZON + rnd(-40, 200), vx: rnd(-14, 14),
      vy: kind === 'firefly' ? rnd(-10, 10) : rnd(12, 34),
      size: rnd(2, 5), life: 1, max: 1, kind,
      hue: kind === 'petal' ? 'rgba(255,170,205,' : kind === 'firefly' ? 'rgba(255,240,140,' : 'rgba(255,255,255,'
    });
  }

  /* ================= 游戏流程 ================= */
  function reset(){
    objs = []; parts = []; pops = []; ambient = []; bubble = null;
    G.t = 0; G.dist = 0; G.stars = 0; G.lives = 3; G.score = 0;
    G.speed = 16; G.combo = 0; G.comboT = 0; G.inv = 0;
    G.shake = 0; G.flash = 0; G.slow = 0; G.spawnT = 1.2; G.dyingT = 0;
    G.nextMilestone = 300; G.level = 1; G.shield = false; G.magnet = 0; G.zw = 0; G.zwFlash = 0;
    G.banner = null; G.biome = 0; G.graceT = 2.2;
    P.x = 0; P.tx = 0; P.y = 0; P.vy = 0; P.air = false; P.slide = 0; P.lean = 0;
    P.crouch = 0; P.stretch = 1;
    updateHearts(); updateScore(true); updateBuffs();
  }

  function startGame(){
    audio();
    reset();
    G.state = 'play';
    pk('start');
    hide('scrStart'); hide('scrOver'); hide('scrPause');
    sfx.start();
    say('出发咯！');
  }

  function gameOver(){
    G.state = 'over';
    pk('stop');
    const isNew = G.score > G.best;
    if (isNew) G.best = G.score;
    if (Math.floor(G.dist) > G.bestDist) G.bestDist = Math.floor(G.dist);
    try {
      localStorage.setItem('cr_best', String(G.best));
      localStorage.setItem('cr_bestdist', String(G.bestDist));

    updateBestLabels();
    show('scrOver');
    sfx.over();
    for (let i = 0; i < 26; i++){
      burst(rnd(40, LW - 40), rnd(60, 300), pick(['#ff9ec4', '#ffd84f', '#8fe8c4', '#a9d6ff', '#ffffff']), 1, 120, 120);

  function updateBestLabels(){
    document.getElementById('bestStart').textContent = G.best;
    document.getElementById('bestDist').textContent = G.bestDist + ' m';
  }
  function show(id){ const el = document.getElementById(id); if (el) el.classList.remove('hidden'); }
  function hide(id){ const el = document.getElementById(id); if (el) el.classList.add('hidden'); }

  /* ================= 输入 ================= */
  function move(dir){
    if (G.state !== 'play') return;
    const nx = clamp(P.tx + dir, -1, 1);
    if (nx === P.tx) return;
    P.tx = nx;
    tone(500 + (dir > 0 ? 70 : -70), .06, 'sine', .05);
    try { if (navigator.vibrate) navigator.vibrate(8); } catch(e){}
  }
  function doJump(){
    if (G.state !== 'play') return;
    if (P.air) return;
    P.vy = JUMP_V; P.air = true; P.slide = 0; P.crouch = 0;
    P.stretch = 1.18;
    sfx.jump();
    const px = LW * .5 + P.x * LANE_U;
    ringBurst(px, BASE_Y + 10, 'rgba(255,255,255,.9)', 16, 78, .42, 7);
    burst(px, BASE_Y, 'rgba(255,255,255,.95)', 12, 150, 110);
    ringBurst(px, BASE_Y + 10, 'rgba(255,190,220,.85)', 8, 46, .28, 5);
  }
  function doSlide(){
    if (G.state !== 'play') return;
    if (P.slide > .05) return;
    P.slide = SLIDE_T;
    if (P.air){ P.vy = Math.min(P.vy, -1100); P.stretch = 1.06; }
    sfx.slide();
    const px = LW * .5 + P.x * LANE_U;
    burst(px, BASE_Y - 6, 'rgba(255,235,245,.9)', 10, 170, 20);
  }

  window.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A'){ e.preventDefault(); move(-1); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D'){ e.preventDefault(); move(1); }
    else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' '){ e.preventDefault(); doJump(); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S'){ e.preventDefault(); doSlide(); }
    else if (k === 'p' || k === 'P' || k === 'Escape'){ e.preventDefault(); togglePause(); }
    else if (k === 'Enter'){
      e.preventDefault();
      if (G.state === 'ready' || G.state === 'over') startGame();
      else if (G.state === 'pause') togglePause();
    }
  }, { passive: false });

  /* 手势：只支持滑动 —— 点屏幕（无论点哪里）不触发任何动作 */
  let thumbMode = false;
  let ptr = null;
  const SWIPE_X = 26, SWIPE_Y = 34;

  app.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    ptr = { x0: e.clientX, y0: e.clientY, t0: Date.now(), done: false };
  });
  app.addEventListener('pointermove', e => {
    if (!ptr || ptr.done || G.state !== 'play') return;
    const dx = e.clientX - ptr.x0, dy = e.clientY - ptr.y0;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax < SWIPE_X && ay < SWIPE_Y) return;
    if (ax > ay * 1.15){
      move(dx > 0 ? 1 : -1);
      ptr.done = true;
    } else if (ay > ax * 1.15){
      if (dy < 0) doJump(); else doSlide();
      ptr.done = true;
    }
  });
  // 点按不再触发任何动作，只清理手势状态
  app.addEventListener('pointerup', () => { ptr = null; });
  app.addEventListener('pointercancel', () => { ptr = null; });
  app.addEventListener('pointerleave', () => { ptr = null; });

  function togglePause(){
    if (G.state === 'play'){
      G.state = 'pause'; show('scrPause'); pk('stop');
    } else if (G.state === 'pause'){
      withBreak(() => { G.state = 'play'; hide('scrPause'); last = performance.now(); pk('start'); });
    }
  }
  // 重开：Poki 要求广告放在"从暂停/结束回到游戏"的自然断点
  function restart(){
    if (POKI) withBreak(startGame); else startGame();
  }
  document.getElementById('btnPause').onclick = togglePause;
  document.getElementById('btnStart').onclick = startGame;
  document.getElementById('btnRetry').onclick = restart;
  document.getElementById('btnResume').onclick = togglePause;
  document.getElementById('btnRestart').onclick = restart;
  document.getElementById('btnHome').onclick = () => {
    G.state = 'ready'; reset(); hide('scrOver'); show('scrStart'); updateBestLabels();

  // 头像 / 昵称 / 排行榜

  /* ================= 自定义头像 / 昵称 ================= */
  const DEFAULT_AVATAR = AVATAR_SRC;
  let myAvatar = '';
  let myName = '';
  let uid = '';
  try {
    myAvatar = localStorage.getItem('cr_avatar') || '';
    myName = localStorage.getItem('cr_name') || '';
    uid = localStorage.getItem('cr_uid') || '';
  } catch(e){}
  if (!uid){
    uid = 'p' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);

  });
