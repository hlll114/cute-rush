<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffd9ea">
<meta name="description" content="可爱冲刺 Cute Rush：开着粉色小车在糖果赛道上躲避雪糕筒、护栏和睡猫的可爱竞速小游戏，手机电脑打开即玩，无需下载。">
<meta name="keywords" content="可爱冲刺,Cute Rush,小游戏,竞速,躲避,网页游戏,手机小游戏">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='%23ffd9ea'/%3E%3Cpath%20d='M32%2050c-11-8-18-14-18-22a10%2010%200%200%201%2018-6%2010%2010%200%200%201%2018%206c0%208-7%2014-18%2022z'%20fill='%23ff5f9b'/%3E%3Ccircle%20cx='25'%20cy='27'%20r='2.4'%20fill='%23fff'/%3E%3Ccircle%20cx='39'%20cy='27'%20r='2.4'%20fill='%23fff'/%3E%3C/svg%3E">
<title>可爱冲刺 · Cute Rush</title>
<style>
  :root{
    --pink:#ff5f9b;
    --pink-l:#ffa6cd;
    --deep:#6b4d7a;
    --ff:'PingFang SC','Microsoft YaHei UI','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#f3e6f4}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:var(--ff);color:var(--deep);
    background:
      radial-gradient(circle at 18% 12%, #ffe1f0 0 26%, transparent 60%),
      radial-gradient(circle at 82% 22%, #dcefff 0 24%, transparent 58%),
      radial-gradient(circle at 60% 88%, #e2fff3 0 26%, transparent 60%),
      #f6ecf8;
  }
  #app{
    position:relative;aspect-ratio:9/16;width:min(100vw,calc(100dvh * 9 / 16));max-height:100dvh;
    border-radius:22px;overflow:hidden;isolation:isolate;
    box-shadow:0 26px 60px rgba(122,72,110,.28), 0 0 0 8px rgba(255,255,255,.75);
    background:#cfe9ff;
  }
  canvas#game{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;padding:30px 14px 12px;display:flex;justify-content:space-between;align-items:flex-start;z-index:3}
  #left{display:flex;flex-direction:column;gap:6px}
  #lives{display:flex;gap:5px;font-size:23px;line-height:1;filter:drop-shadow(0 2px 3px rgba(180,60,110,.35))}
  #lives .h{color:#ff4f92;transition:transform .18s,opacity .25s}
  #lives .h.off{opacity:.26;filter:grayscale(1) brightness(1.4);transform:scale(.86)}
  #lives.pulse .h{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.42)}100%{transform:scale(1)}}
  #pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.82);
    border-radius:999px;padding:3px 12px;font-size:13px;font-weight:800;color:#a2588a;
    box-shadow:0 3px 8px rgba(160,80,130,.18);width:max-content}
  #right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  #score{font-size:34px;font-weight:900;color:#fff;letter-spacing:.5px;
    -webkit-text-stroke:6px #ff74aa;paint-order:stroke fill;
    text-shadow:0 4px 0 rgba(226,86,143,.55);line-height:1;font-variant-numeric:tabular-nums}
  #score.bump{animation:pop .22s ease}
  #btns{display:flex;gap:8px;pointer-events:auto}
  .icon{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.86);font-size:17px;
    display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 10px rgba(160,80,130,.22);color:#c0558c;
    transition:transform .1s}
  .icon:active{transform:scale(.92)}

  /* ---------- screens ---------- */
  .screen{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;padding:26px;text-align:center;
    background:linear-gradient(180deg,rgba(255,240,248,.62),rgba(226,240,255,.72));
    backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);transition:opacity .28s}
  .screen.hidden{opacity:0;pointer-events:none}
  .hero{width:132px;height:132px;border-radius:50%;object-fit:cover;
    box-shadow:0 12px 26px rgba(200,90,150,.35),0 0 0 6px #fff;animation:float 3.2s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
  h1{margin:2px 0 0;font-size:40px;line-height:1.12;font-weight:900;letter-spacing:1px;color:#ff5f9b;
    text-shadow:0 3px 0 #fff,0 6px 0 rgba(255,180,210,.9),0 12px 22px rgba(255,95,155,.32)}
  h1 small{display:block;font-size:14px;letter-spacing:6px;color:#b0759f;text-shadow:none;margin-top:6px;font-weight:800}
  .tip{font-size:14px;line-height:1.75;color:#8b6b93;max-width:330px;margin:2px 0}
  .tip b{color:#e2568f}
  .keys{display:flex;gap:8px;justify-content:center;margin-top:2px}
  .kbd{background:#fff;border-radius:10px;padding:5px 11px;font-weight:900;font-size:13px;color:#c0558c;
    box-shadow:0 3px 0 #f0c9dd,0 6px 12px rgba(200,110,160,.18)}
  .btn{border:0;border-radius:999px;padding:15px 46px;font-size:20px;font-weight:900;letter-spacing:2px;color:#fff;
    font-family:inherit;cursor:pointer;
    background:linear-gradient(180deg,#ffa1cb,#ff5f9b);
    box-shadow:0 7px 0 #dd4a86,0 14px 26px rgba(255,95,155,.4);
    transition:transform .08s,box-shadow .08s;margin-top:6px}
  .btn:active{transform:translateY(5px);box-shadow:0 2px 0 #dd4a86,0 6px 14px rgba(255,95,155,.4)}
  .btn.ghost{background:linear-gradient(180deg,#fff,#ffe9f3);color:#e2568f;box-shadow:0 7px 0 #f2c6dc,0 14px 22px rgba(220,140,180,.25);
    font-size:16px;padding:12px 28px;letter-spacing:1px}
  .btn.ghost:active{box-shadow:0 2px 0 #f2c6dc}
  .card{background:rgba(255,255,255,.82);border-radius:22px;padding:14px 26px;display:flex;gap:26px;
    box-shadow:0 10px 24px rgba(180,110,160,.18)}
  .card div{display:flex;flex-direction:column;gap:3px}
  .card span{font-size:11px;letter-spacing:1px;color:#ad85a0;font-weight:800}
  .card b{font-size:24px;color:#e2568f;font-weight:900;font-variant-numeric:tabular-nums}
  .bigscore{font-size:64px;font-weight:900;color:#ff5f9b;line-height:1;
    -webkit-text-stroke:8px #fff;paint-order:stroke fill;text-shadow:0 8px 0 rgba(255,180,210,.8)}
  .newrec{font-size:14px;font-weight:900;color:#fff;background:linear-gradient(90deg,#ffb347,#ff6aa8);
    padding:5px 16px;border-radius:999px;box-shadow:0 5px 12px rgba(255,140,90,.35);animation:pop 1s ease infinite}

  /* ---------- pads ---------- */
  #pads{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:0 18px 22px;z-index:4;pointer-events:none}
  .pad{pointer-events:auto;width:72px;height:72px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(255,255,255,.55);color:#fff;font-size:26px;font-weight:900;
    box-shadow:0 6px 16px rgba(140,80,120,.22),inset 0 0 0 3px rgba(255,255,255,.85);
    text-shadow:0 2px 4px rgba(200,80,140,.35);transition:transform .09s,background .15s;
    -webkit-text-stroke:0}
  .pad:active,.pad.hit{transform:scale(.9);background:rgba(255,255,255,.85)}
  @media (hover:hover){ .pad{opacity:.55} #app:hover .pad{opacity:.9} }
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <noscript><div style="position:absolute;inset:0;display:grid;place-items:center;background:#fff0f7;color:#c0558c;font:600 16px/1.7 'Microsoft YaHei',sans-serif;text-align:center;padding:30px;z-index:9">需要开启 JavaScript 才能开跑哦～<br>请在浏览器设置里允许本页面运行脚本。</div></noscript>

  <div id="hud">
    <div id="left">
      <div id="lives"></div>
      <div id="pill"><span id="dist">0 m</span></div>
    </div>
    <div id="right">
      <div id="score">0</div>
      <div id="btns">
        <button class="icon" id="btnMute" title="声音">🔊</button>
        <button class="icon" id="btnPause" title="暂停">⏸</button>
      </div>
    </div>
  </div>

  <div id="pads">
    <button class="pad" id="padL">◀</button>
    <button class="pad" id="padR">▶</button>
  </div>

  <div class="screen" id="scrStart">
    <img class="hero" id="hero" alt="主角">
    <h1>可爱冲刺<small>CUTE RUSH</small></h1>
    <p class="tip">左右闪避路上的障碍，一路收集<b>⭐星星</b>加分<br>撞到会掉一颗心，捡到<b>❤爱心</b>可以回血</p>
    <div class="keys"><span class="kbd">←</span><span class="kbd">→</span><span class="kbd">A / D</span><span class="kbd">滑动</span></div>
    <button class="btn" id="btnStart">开 始 奔 跑</button>
    <div class="card" style="margin-top:6px"><div><span>最高分</span><b id="bestStart">0</b></div><div><span>最远距离</span><b id="bestDist">0 m</b></div></div>
  </div>

  <div class="screen hidden" id="scrOver">
    <img class="hero" id="hero2" alt="" style="width:96px;height:96px">
    <h1 style="font-size:32px">撞到啦！</h1>
    <div class="bigscore" id="finalScore">0</div>
    <div class="newrec hidden" id="newRecord">🎉 新纪录！</div>
    <div class="card"><div><span>本次距离</span><b id="finalDist">0 m</b></div><div><span>星星</span><b id="finalCoins">0</b></div><div><span>最高分</span><b id="bestOver">0</b></div></div>
    <button class="btn" id="btnRetry">再 来 一 次</button>
    <button class="btn ghost" id="btnHome">返回首页</button>
  </div>

  <div class="screen hidden" id="scrPause">
    <h1 style="font-size:34px">暂停中…</h1>
    <p class="tip">喘口气，顺便整理一下发型</p>
    <button class="btn" id="btnResume">继 续</button>
    <button class="btn ghost" id="btnRestart">重新开始</button>
  </div>
</div>

  /* ================= 基础设置 ================= */
  const LW = 540, LH = 960;              // 逻辑画布尺寸（9:16）
  const HORIZON = 386;                   // 地平线
  const BASE_Y  = 902;                   // 玩家所在深度处的屏幕 y
  const CAM = 4.6;                       // 透视相机
  const LANE_U = 150;                    // 一条车道在近处的屏幕宽度
  const ROAD_EDGE = 1.55;                // 路面半宽（车道单位）
  const SPAWN_Z = 46;                    // 障碍生成深度
  const HIT_Z = 1.05;                    // 碰撞判定深度

  const proj = z => CAM / (CAM + z);
  const yOf  = z => HORIZON + (BASE_Y - HORIZON) * proj(z);
  const xOf  = (off, z) => LW * 0.5 + off * LANE_U * proj(z);
  const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
  const rnd = (a,b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];

  const app = document.getElementById('app');
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d', { alpha: false });
  let scale = 1, dpr = 1, bg = null;

  function resize(){
    const r = app.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    scale = cv.width / LW;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  /* ================= 音效 ================= */
  let ac = null;
  let muted = false;
  try { muted = localStorage.getItem('cr_mute') === '1'; } catch(e){}
  function audio(){
    if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ ac = null; } }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, dur, type, vol, slideTo, delay){
    if (muted) return;
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  const sfx = {
    coin: (n) => { const k = 1 + Math.min(n, 6) * 0.06; tone(880 * k, .09, 'triangle', .10); tone(1320 * k, .12, 'triangle', .09, null, .06); },
    hit:  () => { tone(220, .26, 'sawtooth', .16, 70); tone(110, .3, 'square', .08, 55); },
    heart:() => { tone(660, .1, 'sine', .12); tone(880, .1, 'sine', .12, null, .1); tone(1174, .18, 'sine', .12, null, .2); },
    start:() => { tone(523, .1, 'triangle', .1); tone(659, .1, 'triangle', .1, null, .1); tone(784, .18, 'triangle', .11, null, .2); },
    over: () => { tone(520, .18, 'triangle', .12, 400); tone(392, .2, 'triangle', .12, 300, .16); tone(262, .5, 'triangle', .12, 180, .34); },
    level:() => { tone(784, .1, 'sine', .1); tone(1046, .14, 'sine', .1, null, .09); }
  };

  const player = { x: 0, tx: 0, vx: 0 };

  const headImg = new Image();

  /* ================= 背景（预渲染） ================= */
  function buildBG(){
    bg = document.createElement('canvas');
    bg.width = LW * 2; bg.height = LH * 2;
    const b = bg.getContext('2d');
    b.scale(2, 2);

    // 天空
    let g = b.createLinearGradient(0, 0, 0, HORIZON + 80);
    g.addColorStop(0, '#a9dcff');
    g.addColorStop(.45, '#cfe8ff');
    g.addColorStop(.75, '#ffe6f4');
    g.addColorStop(1, '#fff2e4');
    b.fillStyle = g;
    b.fillRect(0, 0, LW, HORIZON + 90);

    // 太阳
    const sun = b.createRadialGradient(408, 128, 10, 408, 128, 96);
    sun.addColorStop(0, 'rgba(255,250,220,.98)');
    sun.addColorStop(.35, 'rgba(255,236,190,.55)');
    sun.addColorStop(1, 'rgba(255,236,190,0)');
    b.fillStyle = sun;
    b.beginPath(); b.arc(408, 128, 96, 0, 7); b.fill();
    b.fillStyle = '#fff6d8';
    b.beginPath(); b.arc(408, 128, 34, 0, 7); b.fill();

    // 云
    const cloud = (x, y, s, a) => {
      b.fillStyle = 'rgba(255,255,255,' + a + ')';
      b.beginPath();
      b.arc(x, y, 30 * s, 0, 7);
      b.arc(x + 34 * s, y - 14 * s, 24 * s, 0, 7);
      b.arc(x + 68 * s, y + 2 * s, 27 * s, 0, 7);
      b.arc(x + 34 * s, y + 14 * s, 26 * s, 0, 7);
      b.fill();
    };
    cloud(60, 132, 1.0, .92);
    cloud(300, 74, .78, .8);
    cloud(392, 232, .62, .72);
    cloud(-30, 300, .55, .55);

    // 远山
    const hill = (color, arr) => {
      b.fillStyle = color;
      b.beginPath();
      b.moveTo(-40, HORIZON + 12);
      for (let i = 0; i < arr.length; i += 3){
        b.quadraticCurveTo(arr[i], arr[i + 1], arr[i + 2], HORIZON + 12);
      }
      b.lineTo(LW + 40, HORIZON + 12);
      b.closePath(); b.fill();
    };
    hill('#c9efdd', [40, 266, 210, 250, 240, 400, 430, 268, 620]);
    hill('#abe1c9', [-40, 320, 130, 190, 300, 330, 400, 300, 600]);

    // 地面
    const gg = b.createLinearGradient(0, HORIZON, 0, LH);
    gg.addColorStop(0, '#c7efdb');
    gg.addColorStop(.4, '#d9f7e7');
    gg.addColorStop(1, '#e8fff2');
    b.fillStyle = gg;
    b.fillRect(0, HORIZON, LW, LH - HORIZON);

    // 地面上的小花点点
    for (let i = 0; i < 90; i++){
      const x = Math.random() * LW, y = HORIZON + Math.random() * (LH - HORIZON);
      const s = 2 + Math.random() * 3;
      b.fillStyle = Math.random() > .5 ? 'rgba(255,255,255,.75)' : 'rgba(255,196,220,.75)';
      b.beginPath(); b.arc(x, y, s, 0, 7); b.fill();
    }
  }

  /* ================= 绘制工具 ================= */
  function rr(c, x, y, w, h, r){
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function starPath(c, r, inner, n, rot){
    c.beginPath();
    for (let i = 0; i < n * 2; i++){
      const ang = (rot || -Math.PI / 2) + i * Math.PI / n;
      const rr2 = i % 2 ? r * (inner || .45) : r;
      const x = Math.cos(ang) * rr2, y = Math.sin(ang) * rr2;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.closePath();
  }
  function heartPath(c, s){
    c.beginPath();
    c.moveTo(0, s * .32);
    c.bezierCurveTo(-s * 1.15, -s * .42, -s * .5, -s * 1.1, 0, -s * .45);
    c.bezierCurveTo(s * .5, -s * 1.1, s * 1.15, -s * .42, 0, s * .32);
    c.closePath();
  }
  function face(c, x, y, s, mode){
    c.fillStyle = '#3d2b46';
    if (mode === 'happy'){
      c.lineWidth = 2.6 * s; c.strokeStyle = '#3d2b46'; c.lineCap = 'round';
      c.beginPath(); c.arc(x - 6 * s, y, 4 * s, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
      c.beginPath(); c.arc(x + 6 * s, y, 4 * s, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
    } else {
      c.beginPath(); c.arc(x - 6 * s, y, 2.6 * s, 0, 7); c.fill();
      c.beginPath(); c.arc(x + 6 * s, y, 2.6 * s, 0, 7); c.fill();
      c.fillStyle = 'rgba(255,255,255,.85)';
      c.beginPath(); c.arc(x - 6.9 * s, y - .9 * s, .9 * s, 0, 7); c.fill();
      c.beginPath(); c.arc(x + 5.1 * s, y - .9 * s, .9 * s, 0, 7); c.fill();
    }
    // 腮红
    c.fillStyle = 'rgba(255,130,170,.45)';
    c.beginPath(); c.ellipse(x - 12 * s, y + 5 * s, 4.2 * s, 2.6 * s, 0, 0, 7); c.fill();
    c.beginPath(); c.ellipse(x + 12 * s, y + 5 * s, 4.2 * s, 2.6 * s, 0, 0, 7); c.fill();
    // 嘴
    c.strokeStyle = '#3d2b46'; c.lineWidth = 2 * s; c.lineCap = 'round';
    c.beginPath(); c.arc(x, y + 5 * s, 3.4 * s, .2, Math.PI - .2); c.stroke();
  }

  /* ================= 路面 ================= */
  function band(c, o1, o2, z1, z2, color){
    const y1 = yOf(z1), y2 = yOf(z2);
    c.beginPath();
    c.moveTo(xOf(o1, z1), y1);
    c.lineTo(xOf(o2, z1), y1);
    c.lineTo(xOf(o2, z2), y2);
    c.lineTo(xOf(o1, z2), y2);
    c.closePath();
    c.fillStyle = color;
    c.fill();
  }

  function drawRoad(){
    const ZMAX = 320;
    // 路面
    const g = ctx.createLinearGradient(0, HORIZON, 0, LH);
    g.addColorStop(0, '#8b86b8');
    g.addColorStop(.35, '#7f7aae');
    g.addColorStop(1, '#6f6aa2');
    ctx.beginPath();
    ctx.moveTo(xOf(-ROAD_EDGE, -2), yOf(-2));
    ctx.lineTo(xOf(ROAD_EDGE, -2), yOf(-2));
    ctx.lineTo(xOf(ROAD_EDGE, ZMAX), yOf(ZMAX));
    ctx.lineTo(xOf(-ROAD_EDGE, ZMAX), yOf(ZMAX));
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();

    // 路缘（粉白相间）
    const CS = 5;
    const off = G.dist % CS;
    for (let i = 0; i < 90; i++){
      const z1 = i * CS - off, z2 = z1 + CS;
      if (z2 < -2) continue;
      const col = ((Math.floor(G.dist / CS) + i) % 2) ? '#ff9ec6' : '#ffffff';
      band(ctx, ROAD_EDGE, ROAD_EDGE + .22, Math.max(z1, -2), z2, col);
      band(ctx, -ROAD_EDGE - .22, -ROAD_EDGE, Math.max(z1, -2), z2, col);
    }
    // 路肩细线
    band(ctx, ROAD_EDGE - .04, ROAD_EDGE, -2, 220, 'rgba(255,255,255,.8)');
    band(ctx, -ROAD_EDGE, -ROAD_EDGE + .04, -2, 220, 'rgba(255,255,255,.8)');

    // 车道虚线
    const D = 6;
    const doff = G.dist % D;
    for (let i = 0; i < 70; i++){
      const z1 = i * D - doff, z2 = z1 + 3;
      if (z2 < -1) continue;
      const a = clamp(proj(z1) * 1.6, 0, 1);
      ctx.globalAlpha = a * .9;
      band(ctx, -.5 - .022, -.5 + .022, z1, z2, '#ffffff');
      band(ctx, .5 - .022, .5 + .022, z1, z2, '#ffffff');
      ctx.globalAlpha = 1;
    }
  }

  /* ================= 路边风景 ================= */
  function drawScenery(){
    const S = 13;
    const off = G.dist % S;
    for (let i = 0; i < 30; i++){
      const z = i * S - off;
      if (z < -1 || z > 150) continue;
      const s = proj(z) * 1.25;
      const y = yOf(z);
      const idx = Math.floor(G.dist / S) + i;
      for (const side of [-1, 1]){
        const x = xOf(side * (ROAD_EDGE + .32 + ((idx + (side > 0 ? 1 : 0)) % 3) * .07), z);
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        const k = (idx * 31 + (side > 0 ? 7 : 3)) % 5;
        if (k === 0) tree(0, 0, 1.0, '#ffc6dd');
        else if (k === 1) tree(0, 0, .88, '#8fe8c4');
        else if (k === 2) bush(0, 0);
        else if (k === 3) tree(0, 0, .78, '#7ee0b8');
        else tree(0, 0, .68, '#ffd6e8');
        ctx.restore();
      }
    }
  }
  function tree(x, y, k, col){
    ctx.fillStyle = '#c98b6b';
    rr(ctx, x - 6 * k, y - 34 * k, 12 * k, 36 * k, 5 * k); ctx.fill();
    const base = col || '#8fe8c4';
    ctx.fillStyle = base;
    ctx.beginPath(); ctx.arc(x, y - 58 * k, 26 * k, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 18 * k, y - 44 * k, 18 * k, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 18 * k, y - 46 * k, 19 * k, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.arc(x - 8 * k, y - 64 * k, 9 * k, 0, 7); ctx.fill();
    // 小果子
    ctx.fillStyle = base === '#ffc6dd' || base === '#ffd6e8' ? '#ff9ec6' : '#ff8fbf';
    ctx.beginPath(); ctx.arc(x + 12 * k, y - 52 * k, 3.4 * k, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 14 * k, y - 48 * k, 3 * k, 0, 7); ctx.fill();
  }
  function bush(x, y){
    ctx.fillStyle = '#9de8c8';
    ctx.beginPath(); ctx.arc(x, y - 12, 20, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x - 18, y - 6, 14, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 18, y - 7, 15, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(x - 5, y - 18, 7, 0, 7); ctx.fill();
  }

  /* ================= 障碍 & 道具 ================= */
  function shadowEllipse(w, h, a){
    ctx.fillStyle = 'rgba(60,40,80,' + a + ')';
    ctx.beginPath(); ctx.ellipse(0, 0, w, h, 0, 0, 7); ctx.fill();
  }

  function drawCone(){
    shadowEllipse(30, 9, .18);
    // 底座
    ctx.fillStyle = '#f08a3c'; rr(ctx, -31, -11, 62, 12, 6); ctx.fill();
    ctx.fillStyle = '#ffb85c'; rr(ctx, -31, -13, 62, 7, 4); ctx.fill();
    // 锥体
    const g = ctx.createLinearGradient(-26, 0, 26, 0);
    g.addColorStop(0, '#ff9d3f'); g.addColorStop(.45, '#ffc06a'); g.addColorStop(1, '#f2862f');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, -76); ctx.quadraticCurveTo(16, -40, 26, -9);
    ctx.lineTo(-26, -9); ctx.quadraticCurveTo(-16, -40, 0, -76); ctx.closePath(); ctx.fill();
    // 反光条
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.beginPath(); ctx.moveTo(-14.5, -44); ctx.lineTo(14.5, -44); ctx.lineTo(18, -30); ctx.lineTo(-18, -30); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -37, 16.5, 3.4, 0, 0, 7); ctx.fill();
    face(ctx, 0, -56, 1, 'happy');
  }

  function drawBarrier(){
    shadowEllipse(62, 11, .18);
    // 腿
    ctx.fillStyle = '#e8608f';
    rr(ctx, -46, -34, 11, 36, 5); ctx.fill();
    rr(ctx, 35, -34, 11, 36, 5); ctx.fill();
    // 挡板
    const g = ctx.createLinearGradient(0, -72, 0, -28);
    g.addColorStop(0, '#ff9dc4'); g.addColorStop(1, '#ff6ea8');
    ctx.fillStyle = g;
    rr(ctx, -64, -74, 128, 48, 12); ctx.fill();
    // 斜条纹
    ctx.save();
    rr(ctx, -64, -74, 128, 48, 12);
    ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (let i = -80; i < 80; i += 26){
      ctx.beginPath();
      ctx.moveTo(i, -26); ctx.lineTo(i + 12, -26); ctx.lineTo(i + 34, -74); ctx.lineTo(i + 22, -74);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3;
    rr(ctx, -64, -74, 128, 48, 12); ctx.stroke();
    face(ctx, 0, -52, 1.25, 'happy');
  }

  function drawCat(){
    shadowEllipse(42, 10, .18);
    // 尾巴
    ctx.strokeStyle = '#ffe6f0'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(28, -20); ctx.quadraticCurveTo(56, -22, 50, -46); ctx.stroke();
    ctx.strokeStyle = '#ffc7dd'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(28, -20); ctx.quadraticCurveTo(56, -22, 50, -46); ctx.stroke();
    // 身体
    ctx.fillStyle = '#fff4fa';
    ctx.beginPath(); ctx.ellipse(0, -24, 42, 26, 0, 0, 7); ctx.fill();
    // 头
    ctx.beginPath(); ctx.arc(-6, -48, 27, 0, 7); ctx.fill();
    // 耳朵
    ctx.beginPath(); ctx.moveTo(-28, -62); ctx.lineTo(-24, -84); ctx.lineTo(-8, -70); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(12, -68); ctx.lineTo(18, -88); ctx.lineTo(24, -64); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffb3d1';
    ctx.beginPath(); ctx.moveTo(-24, -66); ctx.lineTo(-22, -79); ctx.lineTo(-13, -70); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(15, -70); ctx.lineTo(18, -82); ctx.lineTo(22, -68); ctx.closePath(); ctx.fill();
    // 脸
    face(ctx, -6, -46, 1, 'happy');
    // 胡须
    ctx.strokeStyle = 'rgba(160,120,150,.55)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-26, -48); ctx.lineTo(-40, -52); ctx.moveTo(-26, -44); ctx.lineTo(-40, -42); ctx.stroke();
  }

  function drawStar(t){
    const y = -30 + Math.sin(t * 6) * 3;
    ctx.save(); ctx.translate(0, y);
    ctx.rotate(Math.sin(t * 2) * .12);
    ctx.shadowColor = 'rgba(255,214,90,.9)'; ctx.shadowBlur = 18;
    const g = ctx.createLinearGradient(0, -30, 0, 30);
    g.addColorStop(0, '#fff3a8'); g.addColorStop(.5, '#ffd84f'); g.addColorStop(1, '#ffae2e');
    ctx.fillStyle = g;
    starPath(ctx, 30, .46, 5);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2.4; ctx.stroke();
    // 小脸
    ctx.fillStyle = '#8a5a26';
    ctx.beginPath(); ctx.arc(-6, -2, 2.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -2, 2.4, 0, 7); ctx.fill();
    ctx.strokeStyle = '#8a5a26'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 2, 3.2, .3, Math.PI - .3); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.beginPath(); ctx.arc(-7, -12, 3.2, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawHeartItem(t){
    const y = -34 + Math.sin(t * 5) * 4;
    ctx.save(); ctx.translate(0, y);
    ctx.scale(1 + Math.sin(t * 9) * .04, 1 + Math.sin(t * 9) * .04);
    ctx.shadowColor = 'rgba(255,90,150,.85)'; ctx.shadowBlur = 18;
    const g = ctx.createLinearGradient(0, -30, 0, 26);
    g.addColorStop(0, '#ff9dc4'); g.addColorStop(1, '#ff4b8f');
    ctx.fillStyle = g;
    heartPath(ctx, 30); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2.4; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.ellipse(-10, -12, 5, 3.4, -.5, 0, 7); ctx.fill();
    ctx.restore();
  }

  /* ================= 主角 ================= */
  function drawKart(){
    const px = LW * .5 + player.x * LANE_U;
    const bob = Math.sin(G.t * 9) * 2.4;
    const lean = clamp((player.tx - player.x) * 1.1, -.3, .3);

    // 影子
    ctx.fillStyle = 'rgba(60,40,80,.2)';
    ctx.beginPath(); ctx.ellipse(px, BASE_Y + 12, 62, 16, 0, 0, 7); ctx.fill();

    ctx.save();
    ctx.translate(px, BASE_Y + bob);
    ctx.rotate(lean * .12);

    // 尾翼
    ctx.fillStyle = '#ff8fbf';
    rr(ctx, -60, -50, 120, 15, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    rr(ctx, -60, -50, 120, 5, 3); ctx.fill();

    // 车身
    const g = ctx.createLinearGradient(0, -44, 0, 4);
    g.addColorStop(0, '#ffb2d4');
    g.addColorStop(.55, '#ff8fbf');
    g.addColorStop(1, '#ff5f9b');
    ctx.fillStyle = g;
    rr(ctx, -52, -42, 104, 44, 20); ctx.fill();
    // 高光
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    rr(ctx, -40, -36, 30, 9, 5); ctx.fill();
    // 白条
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    rr(ctx, -46, -16, 92, 8, 4); ctx.fill();
    // 轮子
    ctx.fillStyle = '#4b3d5e';
    rr(ctx, -64, -18, 15, 24, 7); ctx.fill();
    rr(ctx, 49, -18, 15, 24, 7); ctx.fill();
    ctx.fillStyle = '#8b7aa3';
    rr(ctx, -60, -12, 6, 10, 3); ctx.fill();
    rr(ctx, 53, -12, 6, 10, 3); ctx.fill();
    // 小爱心尾灯
    ctx.fillStyle = '#fff3f8';
    ctx.beginPath(); ctx.arc(-38, -30, 4.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(38, -30, 4.5, 0, 7); ctx.fill();

    // 脑袋（会点头）
    const hy = -74 + Math.sin(G.t * 9 + 1) * 1.6;
    ctx.save();
    ctx.translate(0, hy);
    ctx.rotate(lean * .45);
    const r = 46;
    ctx.save();
    ctx.shadowColor = 'rgba(255,120,170,.55)'; ctx.shadowBlur = 22;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, 7); ctx.fill();
    ctx.restore();
    if (headReady){
      ctx.save();
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.clip();
      ctx.drawImage(headImg, -r, -r, r * 2, r * 2);
      ctx.restore();
    } else {
      ctx.fillStyle = '#ffd0e2';
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
      face(ctx, 0, 0, 2.2, 'happy');
    }
    ctx.restore();

    ctx.restore();
  }

  /* ================= 粒子 / 飘字 ================= */
  function burst(x, y, color, n, spd, up){
    for (let i = 0; i < n; i++){
      const a = rnd(0, Math.PI * 2), v = rnd(spd * .35, spd);
      parts.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (up || 0),
        life: rnd(.35, .75), max: .75, col: color, size: rnd(3, 7), g: 260
      });
    }
  }
  function popText(x, y, text, color){
    pops.push({ x, y, text, color: color || '#ffd84f', life: 0, max: .95 });
  }
  function say(text){
    bubble = { text, t: 0, life: 1.5 };
  }
  const CHEER = ['冲鸭！', '好险～', '哇哦！', '稳稳的', '我最快！'];

  /* ================= 游戏流程 ================= */
  function reset(){
    objs = []; parts = []; pops = []; bubble = null;
    G.t = 0; G.dist = 0; G.coins = 0; G.lives = 3; G.score = 0;
    G.speed = 17; G.combo = 0; G.comboT = 0; G.inv = 0;
    G.shake = 0; G.flash = 0; G.slow = 0; G.spawnT = .9; G.dyingT = 0;
    G.nextMilestone = 300; G.level = 1;
    player.x = 0; player.tx = 0; player.vx = 0;
    updateHearts(); updateScore(true);
  }

  function startGame(){
    audio();
    reset();
    G.state = 'play';
    hide('scrStart'); hide('scrOver'); hide('scrPause');
    sfx.start();
    say('出发咯！');
  }

  function gameOver(){
    G.state = 'over';
    const isNew = G.score > G.best;
    if (isNew) G.best = G.score;
    if (Math.floor(G.dist) > G.bestDist) G.bestDist = Math.floor(G.dist);
    try {
      localStorage.setItem('cr_best', String(G.best));
      localStorage.setItem('cr_bestdist', String(G.bestDist));
    } catch(e){}
    document.getElementById('finalScore').textContent = G.score;
    document.getElementById('finalDist').textContent = Math.floor(G.dist) + ' m';
    document.getElementById('finalCoins').textContent = G.coins;
    document.getElementById('bestOver').textContent = G.best;
    document.getElementById('newRecord').classList.toggle('hidden', !isNew);
    updateBestLabels();
    show('scrOver');
    sfx.over();
    // 庆祝彩纸
    for (let i = 0; i < 26; i++){
      burst(rnd(40, LW - 40), rnd(60, 300), pick(['#ff9ec4', '#ffd84f', '#8fe8c4', '#a9d6ff', '#ffffff']), 1, 120, 120);
    }
  }

  function updateBestLabels(){
    document.getElementById('bestStart').textContent = G.best;
    document.getElementById('bestDist').textContent = G.bestDist + ' m';
  }

  function show(id){ const el = document.getElementById(id); if (el) el.classList.remove('hidden'); }
  function hide(id){ const el = document.getElementById(id); if (el) el.classList.add('hidden'); }

  /* ================= 输入 ================= */
  function move(dir){
    if (G.state !== 'play') return;
    const nx = clamp(player.tx + dir, -1, 1);
    if (nx === player.tx) return;
    player.tx = nx;
    tone(520 + (dir > 0 ? 60 : -60), .06, 'sine', .05);
  }
  window.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A'){ e.preventDefault(); move(-1); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D'){ e.preventDefault(); move(1); }
    else if (k === 'p' || k === 'P' || k === 'Escape'){ e.preventDefault(); togglePause(); }
    else if (k === ' ' || k === 'Enter'){
      e.preventDefault();
      if (G.state === 'ready' || G.state === 'over') startGame();
      else if (G.state === 'pause') togglePause();
    }
  }, { passive: false });

  // 触屏 / 鼠标：点击左右半屏 & 滑动
  let ptr = null;
  app.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    ptr = { x: e.clientX, y: e.clientY, moved: false };
  });
  app.addEventListener('pointermove', e => {
    if (!ptr || G.state !== 'play') return;
    const dx = e.clientX - ptr.x;
    if (Math.abs(dx) > 26){
      move(dx > 0 ? 1 : -1);
      ptr.x = e.clientX; ptr.moved = true;
    }
  });
  app.addEventListener('pointerup', e => {
    if (!ptr) return;
    if (!ptr.moved && G.state === 'play'){
      const r = app.getBoundingClientRect();
      move((e.clientX - r.left) < r.width / 2 ? -1 : 1);
    }
    ptr = null;
  });
  app.addEventListener('pointercancel', () => { ptr = null; });

  const padL = document.getElementById('padL'), padR = document.getElementById('padR');
  const bindPad = (el, dir) => {
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); el.classList.add('hit'); move(dir); });
    el.addEventListener('pointerup', () => el.classList.remove('hit'));
    el.addEventListener('pointerleave', () => el.classList.remove('hit'));
  };
  bindPad(padL, -1); bindPad(padR, 1);

  function togglePause(){
    if (G.state === 'play'){ G.state = 'pause'; show('scrPause'); }
    else if (G.state === 'pause'){ G.state = 'play'; hide('scrPause'); last = performance.now(); }
  }
  document.getElementById('btnPause').onclick = togglePause;
  document.getElementById('btnStart').onclick = () => { startGame(); };
  document.getElementById('btnRetry').onclick = () => { startGame(); };
  document.getElementById('btnResume').onclick = () => { togglePause(); };
  document.getElementById('btnRestart').onclick = () => { startGame(); };
  document.getElementById('btnHome').onclick = () => {
    G.state = 'ready'; reset(); hide('scrOver'); show('scrStart'); updateBestLabels();
  };
  const btnMute = document.getElementById('btnMute');
  btnMute.textContent = muted ? '🔇' : '🔊';
  btnMute.onclick = () => {
    muted = !muted;
    btnMute.textContent = muted ? '🔇' : '🔊';
    try { localStorage.setItem('cr_mute', muted ? '1' : '0'); } catch(e){}
    if (!muted) tone(880, .08, 'sine', .1);
  };

  /* ================= HUD ================= */
  const elLives = document.getElementById('lives');
  const elScore = document.getElementById('score');
  const elDist = document.getElementById('dist');
  function updateHearts(pulse){
    let s = '';
    for (let i = 0; i < 3; i++) s += '<span class="h' + (i < G.lives ? '' : ' off') + '">❤</span>';
    elLives.innerHTML = s;
    if (pulse){ elLives.classList.remove('pulse'); void elLives.offsetWidth; elLives.classList.add('pulse'); }
  }
  let lastScore = -1;
  function updateScore(force){
    G.score = Math.floor(G.dist) + G.coins * 20;
    if (G.score !== lastScore || force){
      elScore.textContent = G.score;
      elDist.textContent = Math.floor(G.dist) + ' m';
      lastScore = G.score;
    }
  }

  /* ================= 生成 ================= */
  function addObj(kind, off, z){
    objs.push({ kind, off, z, t: rnd(0, 6), dead: false });
  }
  function spawnRow(){
    const lanes = [-1, 0, 1];
    const r = Math.random();
    const z = SPAWN_Z;

    if (r < 0.10 && G.lives < 3 && G.dist > 120){
      addObj('heart', pick(lanes), z);
      return;
    }
    if (r < 0.34){
      // 一整排星星
      const l = pick(lanes);
      for (let i = 0; i < 4; i++) addObj('star', l, z + i * 5);
      // 偶尔配一点威胁
      if (Math.random() < .45){
        const other = pick(lanes.filter(v => v !== l));
        addObj(pick(['cone', 'barrier', 'cat']), other, z + 6);
      }
      return;
    }
    if (r < 0.66){
      // 单个障碍
      const l = pick(lanes);
      addObj(pick(['cone', 'barrier', 'cat']), l, z);
      if (Math.random() < .5){
        const other = pick(lanes.filter(v => v !== l));
        addObj('star', other, z + 8);
      }
      return;
    }
    if (r < 0.88){
      // 两个障碍，留一条活路
      const shuffled = lanes.slice().sort(() => Math.random() - .5);
      addObj(pick(['cone', 'barrier', 'cat']), shuffled[0], z);
      addObj(pick(['cone', 'barrier', 'cat']), shuffled[1], z + rnd(0, 2));
      if (Math.random() < .6) addObj('star', shuffled[2], z + 5);
      return;
    }
    // 夹缝：三个都有，但中间错开
    const shuffled = lanes.slice().sort(() => Math.random() - .5);
    addObj('cone', shuffled[0], z);
    addObj('cone', shuffled[2], z);
    addObj('star', shuffled[1], z + 7);
  }

  /* ================= 更新 ================= */
  function update(dt){
    if (G.state !== 'play') {
      // 结束/暂停时仍有粒子动画
      updateParticles(dt);
      return;
    }
    const ts = G.slow > 0 ? .38 : 1;
    G.slow = Math.max(0, G.slow - dt);
    const wdt = dt * ts;

    G.t += dt;
    const diff = Math.min(1, G.dist / 950);
    G.speed = 17 + diff * 23;
    G.dist += G.speed * wdt;

    // 车道平滑
    player.x += (player.tx - player.x) * Math.min(1, dt * 13);

    // 无敌闪烁
    if (G.inv > 0) G.inv = Math.max(0, G.inv - dt);
    if (G.comboT > 0){ G.comboT -= dt; if (G.comboT <= 0) G.combo = 0; }

    // 生成
    const gap = 1.12 - diff * .46;
    G.spawnT -= dt;
    if (G.spawnT <= 0){ spawnRow(); G.spawnT = gap * rnd(.85, 1.15); }

    // 里程碑
    if (G.dist > G.nextMilestone){
      G.nextMilestone += 300; G.level++;
      popText(LW / 2, LH * .42, '超快！ +' + (G.level * 100), '#fff');
      G.coins += 5;
      sfx.level();
      say(pick(CHEER));
    }

    // 物体
    for (const o of objs){
      const zPrev = o.z;
      o.z -= G.speed * wdt;
      o.t += wdt;

      if (o.dead) continue;
      if (zPrev > HIT_Z && o.z <= HIT_Z){
        const d = Math.abs(o.off - player.x);
        if (o.kind === 'star'){
          if (d < .8) collectStar(o);
        } else if (o.kind === 'heart'){
          if (d < .85) collectHeart(o);
        } else if (G.inv <= 0 && d < .72){
          crash(o);
        }
      }
      if (o.z < -3) o.dead = true;
    }
    objs = objs.filter(o => !o.dead);

    // 尾迹
    if (Math.random() < .55){
      parts.push({
        x: LW * .5 + player.x * LANE_U + rnd(-40, 40), y: BASE_Y - rnd(0, 18),
        vx: rnd(-20, 20), vy: rnd(-10, 24), life: .4, max: .4,
        col: 'rgba(255,255,255,.85)', size: rnd(3, 7), g: -30
      });
    }

    updateParticles(dt);
    updateScore();
  }

  function updateParticles(dt){
    for (const p of parts){
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += (p.g || 120) * dt;
      p.vx *= .98;
    }
    parts = parts.filter(p => p.life > 0);
    for (const p of pops){ p.life += dt; p.y -= 42 * dt; }
    pops = pops.filter(p => p.life < p.max);
    if (bubble){ bubble.t += dt; if (bubble.t > bubble.life) bubble = null; }
    G.shake *= Math.pow(.001, dt);
    G.flash = Math.max(0, G.flash - dt * 3.2);
  }

  function collectStar(o){
    o.dead = true;
    G.coins++; G.combo++; G.comboT = 2.4;
    const mult = Math.min(5, 1 + Math.floor(G.combo / 4));
    G.dist += 3 * mult;
    const sx = xOf(o.off, o.z), sy = yOf(o.z) - 34 * proj(o.z);
    burst(sx, sy, '#ffd84f', 8, 220, 60);
    popText(sx, sy - 10, '+' + (mult > 1 ? 'x' + mult : '15'), '#ffd84f');
    sfx.coin(G.combo);
    if (G.combo > 0 && G.combo % 8 === 0) say(pick(CHEER));
  }
  function collectHeart(o){
    o.dead = true;
    G.lives = Math.min(3, G.lives + 1);
    updateHearts(true);
    const sx = xOf(o.off, o.z), sy = yOf(o.z) - 34 * proj(o.z);
    burst(sx, sy, '#ff6aa8', 14, 260, 70);
    popText(sx, sy - 10, '+1 ❤', '#ff6aa8');
    sfx.heart();
    say('回血啦！');
  }
  function crash(o){
    o.dead = true;
    G.lives--;
    G.inv = 1.7; G.shake = 22; G.flash = .55; G.slow = .42; G.combo = 0;
    updateHearts(true);
    const sx = xOf(o.off, o.z), sy = yOf(o.z) - 20;
    burst(sx, sy, '#ff9ec4', 16, 300, 90);
    burst(sx, sy, '#ffffff', 10, 220, 70);
    sfx.hit();
    say(pick(['啊哦！', '小心呀！', '不要撞啦！']));
    if (G.lives <= 0){
      G.state = 'dying'; G.dyingT = .75;
      G.shake = 30; G.flash = .8;
    }
  }

  /* ================= 渲染 ================= */
  function render(){
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, LW, LH);

    const sh = G.shake;
    ctx.save();
    if (sh > .4){
      ctx.translate(rnd(-sh, sh) * .5, rnd(-sh, sh) * .5);
    }

    // 背景
    if (bg) ctx.drawImage(bg, 0, 0, LW, LH);
    drawRoad();
    drawScenery();

    // 物体（远 → 近）
    const list = objs.slice().sort((a, b) => b.z - a.z);
    for (const o of list){
      if (o.z < -2) continue;
      const s = proj(o.z);
      const x = xOf(o.off, o.z), y = yOf(o.z);
      const alpha = clamp((SPAWN_Z - o.z) / 10, 0, 1);
      if (alpha <= .01) continue;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.scale(s, s);
      if (o.kind === 'cone') drawCone();
      else if (o.kind === 'barrier') drawBarrier();
      else if (o.kind === 'cat') drawCat();
      else if (o.kind === 'star') drawStar(o.t);
      else if (o.kind === 'heart') drawHeartItem(o.t);
      ctx.restore();
    }

    // 速度线
    const sp = (G.speed - 17) / 23;
    if (sp > .12 && G.state === 'play'){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,.5)';
      ctx.lineCap = 'round';
      for (let i = 0; i < 12; i++){
        const seed = i * 37.7 + Math.floor(G.t * 20) * 11;
        const side = i % 2 ? 1 : -1;
        const y = HORIZON + ((seed * 53) % 500);
        const len = 40 + (seed % 60);
        const xx = LW * .5 + side * (150 + (seed % 130));
        ctx.globalAlpha = sp * .5 * (1 - (y - HORIZON) / 520);
        ctx.lineWidth = 2 + (seed % 3);
        ctx.beginPath(); ctx.moveTo(xx, y); ctx.lineTo(xx + side * 6, y + len); ctx.stroke();
      }
      ctx.restore();
    }

    // 主角（被打中后闪烁）
    if (G.state !== 'over'){
      const blink = G.inv > 0 && Math.floor(G.t * 14) % 2 === 0;
      if (!blink) drawKart();
    }

    // 粒子
    for (const p of parts){
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (.4 + a * .8), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 飘字
    for (const p of pops){
      const a = 1 - p.life / p.max;
      ctx.globalAlpha = Math.max(0, a);
      ctx.font = '900 26px "Microsoft YaHei",system-ui,sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,.95)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color;
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }

    // 气泡
    if (bubble && G.state === 'play'){
      const bx = LW * .5 + player.x * LANE_U + (player.x > .35 ? -70 : 70);
      const by = BASE_Y - 150 + Math.sin(G.t * 6) * 3;
      const a = Math.min(1, (bubble.life - bubble.t) * 3);
      ctx.globalAlpha = clamp(a, 0, 1);
      ctx.font = '900 22px "Microsoft YaHei",system-ui,sans-serif';
      const w = ctx.measureText(bubble.text).width + 30;
      ctx.fillStyle = '#fff';
      rr(ctx, bx - w / 2, by - 24, w, 44, 22); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(bx - 8, by + 18); ctx.lineTo(bx + 8, by + 18); ctx.lineTo(bx - 2, by + 32);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e2568f';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(bubble.text, bx, by - 1);
      ctx.textBaseline = 'alphabetic';
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // 受击闪白
    if (G.flash > 0){
      ctx.fillStyle = 'rgba(255,120,170,' + (G.flash * .5) + ')';
      ctx.fillRect(0, 0, LW, LH);
    }
  }

  /* ================= 主循环 ================= */
  let last = performance.now();
  function loop(now){
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;

    if (G.state === 'dying'){
      G.dyingT -= dt;
      updateParticles(dt);
      if (G.dyingT <= 0) gameOver();
    } else {
      update(dt);
    }
    render();
    requestAnimationFrame(loop);
  }

  /* ================= 启动 ================= */
  function boot(){
    resize();
    buildBG();
    updateBestLabels();
    updateHearts();
    document.getElementById('hero').src = AVATAR_SRC;
    document.getElementById('hero2').src = AVATAR_SRC;

    // 调试 / 截图参数：?shot=start|play|over  或  ?demo=1&fast=1
    const q = location.search;
    const shotParam = (q.match(/shot=(\w+)/) || [])[1] || '';
    const quick = !!shotParam || q.indexOf('demo') >= 0;
    if (quick){
      document.head.insertAdjacentHTML('beforeend',
        '<style>*{transition:none!important;animation:none!important}</style>');
      const dbg = document.createElement('div');
      dbg.id = 'dbg';
      dbg.style.cssText = 'position:absolute;bottom:2px;left:4px;font:10px monospace;color:#222;z-index:99;max-width:100%';
      document.body.appendChild(dbg);
      window.onerror = (m, s, l) => { dbg.textContent = 'ERR ' + m + ' @' + l; };
      window.__dbg = dbg;
    }
    if (shotParam === 'play' || shotParam === 'over' || q.indexOf('demo') >= 0){
      reset();
      G.state = 'play';
      document.getElementById('scrStart').style.display = 'none';
      hide('scrStart');
      G.dist = 268; G.coins = 7; G.speed = 26;
      const spread = [[-1, 12], [0, 20], [1, 27], [-1, 32], [0, 5], [1, 7], [-1, 3]];
      for (const [l, z] of spread) addObj(pick(['cone', 'barrier', 'cat']), l, z);
      addObj('star', 0, 15); addObj('star', 0, 10);
      say('稳稳的');
      updateScore(true);
      if (shotParam === 'over'){
        G.dist = 806; G.coins = 23; G.best = 520; updateScore(true);
        gameOver();
      }
    }
    if (q.indexOf('fast') >= 0){
      const log = [];
      try {
        for (let i = 0; i < 7200; i++){
          if (G.state === 'dying'){ G.dyingT = 0; gameOver(); G.state = 'play'; G.lives = 3; }
          update(1 / 60);
          if (i % 47 === 0) move(Math.random() < .5 ? -1 : 1);
          if (i % 900 === 0) log.push(Math.floor(G.dist) + 'm/L' + G.lives + '/n' + objs.length);
        }
        window.__dbg.textContent = 'OK ' + log.join(' ') + ' final=' + Math.floor(G.dist) + ' score=' + G.score;
      } catch (e){
        window.__dbg.textContent = 'ERR ' + e.message + ' | ' + String(e.stack).split('\n')[1];
      }
    }
    requestAnimationFrame(loop);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
